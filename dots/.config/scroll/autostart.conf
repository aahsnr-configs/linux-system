# ══════════════════════════════════════════════════════════════════════════════
# autostart.conf  –  Programs executed at scroll startup
# Mirrors:  autostart.conf  (Hyprland)
#
# sway/scroll:
#   exec         – run once at startup only
#   exec_always  – run on startup AND on every config reload
# ══════════════════════════════════════════════════════════════════════════════

# ── D-Bus / Session Environment ──────────────────────


# ── XDG Portals ──────────────────────────────────────
# wlr portal handles screencasting/screenshots; gtk portal handles file chooser.
# Restart on reload to pick up the new WAYLAND_DISPLAY.
exec_always hash xdg-desktop-portal-wlr 2>/dev/null && \
    { pkill -x xdg-desktop-portal-wlr; sleep 0.5; \
      /usr/lib/xdg-desktop-portal-wlr & }

# ── Clipboard ─────────────────────────────────────────────────────────────────
exec wl-paste --type text  --watch cliphist store
exec wl-paste --type image --watch cliphist store

# ── Desktop Bar ───────────────────────────────────────────────────────────────
exec qs -c noctalia-shell --no-duplicate

# ── Auto-mount Removable Media ────────────────────────────────────────────────
# Mirrors:  exec-once = udiskie
exec udiskie

# ── Application Daemons ───────────────────────────────────────────────────────
exec thunar --daemon
exec emacs --daemon

# ── ASUS ROG Control Center ─────────────────
exec rog-control-center

# ── Idle / Lock (swayidle replaces Hyprland's built-in idle) ─────────────────
# Locks after 10 min idle, turns off monitors after 10m5s, restores on activity.
exec swayidle -w \
    timeout 600  'swaylock -f' \
    timeout 605  'scrollmsg "output * power off"' \
        resume   'scrollmsg "output * power on"' \
    timeout 30   'if pgrep swaylock; then scrollmsg "output * power off"; fi' \
        resume   'if pgrep swaylock; then scrollmsg "output * power on"; fi' \
    before-sleep 'swaylock -f'

# ── Scratchpad Pre-launch ─────────────────────────────────────────────────────

# Terminal scratchpad  (replaces: pypr toggle term)
exec $terminal --app-id scratch_term

# Yazi file manager  (replaces: pypr toggle yazi)
exec $terminal --app-id scratch_yazi -e yazi

# Lazygit  (replaces: pypr toggle lazygit)
exec $terminal --app-id scratch_lazygit -e lazygit

# Calculator  (replaces: pypr toggle calculator)
exec $terminal --app-id scratch_calc -e python3 -qi

# Spotify  (replaces: pypr toggle spotify)
exec spotify
