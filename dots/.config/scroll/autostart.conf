# ══════════════════════════════════════════════════════════════════════════════
# autostart.conf  –  Programs executed at scroll startup
# Mirrors:  autostart.conf  (Hyprland)
#
# sway/scroll:
#   exec         – run once at startup only
#   exec_always  – run on startup AND on every config reload
# ══════════════════════════════════════════════════════════════════════════════

# ── D-Bus / Session Environment ───────────────────────────────────────────────
# Export the compositor-specific Wayland variables to D-Bus so that portals,
# pipewire and other session services can find the running display.
# (Replaces hyprland-session.target; scroll uses the standard sway session)
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Import into systemd user environment so all user units see the display
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Start the generic Wayland session target (portals, pipewire-session, etc.)
exec systemctl --user start sway-session.target

# ── Polkit Authentication Agent ───────────────────────────────────────────────
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ── XDG Portals ───────────────────────────────────────────────────────────────
# wlr portal handles screencasting/screenshots; gtk portal handles file chooser.
# Restart on reload to pick up the new WAYLAND_DISPLAY.
exec_always hash xdg-desktop-portal-wlr 2>/dev/null && \
    { pkill -x xdg-desktop-portal-wlr; sleep 0.5; \
      /usr/lib/xdg-desktop-portal-wlr & }

# ── Clipboard ─────────────────────────────────────────────────────────────────
# Mirrors:  exec-once = wl-paste --type text/image --watch cliphist store
exec wl-paste --type text  --watch cliphist store
exec wl-paste --type image --watch cliphist store

# ── Desktop Bar ───────────────────────────────────────────────────────────────
# Noctalia quickshell works on any wlr compositor via the layer-shell protocol.
# Remove if your qs config relies on Hyprland-specific IPC events.
exec qs -c noctalia-shell --no-duplicate
# Fallback – uncomment to use waybar instead:
# exec_always waybar

# ── Auto-mount Removable Media ────────────────────────────────────────────────
# Mirrors:  exec-once = udiskie
exec udiskie

# ── Application Daemons ───────────────────────────────────────────────────────
exec thunar --daemon        # keep Thunar thumbnail/VFS cache warm
exec emacs --daemon          # Emacs daemon for instant emacsclient launches

# ── ASUS ROG Control Center (remove if not on ASUS hardware) ─────────────────
exec rog-control-center

# ── Idle / Lock (swayidle replaces Hyprland's built-in idle) ─────────────────
# Locks after 10 min idle, turns off monitors after 10m5s, restores on activity.
exec swayidle -w \
    timeout 600  'swaylock -f' \
    timeout 605  'scrollmsg "output * power off"' \
        resume   'scrollmsg "output * power on"' \
    timeout 30   'if pgrep swaylock; then scrollmsg "output * power off"; fi' \
        resume   'if pgrep swaylock; then scrollmsg "output * power on"; fi' \
    before-sleep 'swaylock -f'

# ── Scratchpad Pre-launch ─────────────────────────────────────────────────────
# Each app is launched with a unique app_id so the for_window rules in
# rules.conf can catch it and immediately send it to the scratchpad.
# (Replaces:  pypr daemon + exec-once = pypr)

# Terminal scratchpad  (replaces: pypr toggle term)
exec $terminal --app-id scratch_term

# Yazi file manager  (replaces: pypr toggle yazi)
exec $terminal --app-id scratch_yazi -e yazi

# Lazygit  (replaces: pypr toggle lazygit)
exec $terminal --app-id scratch_lazygit -e lazygit

# Calculator  (replaces: pypr toggle calculator)
exec $terminal --app-id scratch_calc -e python3 -qi

# Spotify  (replaces: pypr toggle spotify)
# app_id is "spotify" or "com.spotify.Client" depending on install method.
# The for_window rule in rules.conf handles the scratchpad assignment.
exec spotify
