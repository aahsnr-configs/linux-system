# ══════════════════════════════════════════════════════════════════════════════
# keybindings.conf  –  All key, mouse and switch bindings
# Mirrors:  binds.conf  (Hyprland)
#
# sway/scroll binding flags:
#   bindsym                   fire on key press (repeat enabled by default)
#   bindsym --no-repeat       fire once on press; ignore key-hold repeat
#   bindsym --locked          fire even when screen is locked
#   bindsym --whole-window    match anywhere in window (not just titlebar)
#   bindsym --release         fire on key release
#   bindswitch                fire on switch events (lid, tablet-mode)
#
# Modifier names:  $mod = Mod4 (Super)   Mod1 = Alt   Shift   Control
# Mouse buttons:   button1=left  button2=middle  button3=right
#                  button4=scroll-up  button5=scroll-down  button8/9=side
# ══════════════════════════════════════════════════════════════════════════════

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ESSENTIALS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Application launcher     (replaces: $ipc launcher toggle)
bindsym $mod+d          exec $menu

# Session menu / logout    (replaces: $ipc sessionMenu toggle)
bindsym $mod+x          exec wlogout

# Terminal
bindsym $mod+Return     exec $terminal

# Kill focused window      (replaces: killactive)
bindsym $mod+q          kill

# Toggle floating          (replaces: togglefloating)
bindsym $mod+space      floating toggle

# Fullscreen               (replaces: fullscreen, 1)
bindsym $mod+Shift+space fullscreen

# Reload config            (replaces: hyprctl reload)
bindsym $mod+Shift+r    reload

# Lock screen              (replaces: $ipc lockScreen lock in misc submap)
bindsym $mod+l          exec $lock_cmd

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FOCUS NAVIGATION
# Mirrors:  bind = Super, left/right/up/down, exec, $dispatch focus l/r/u/d
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym $mod+Left       focus left
bindsym $mod+Right      focus right
bindsym $mod+Up         focus up
bindsym $mod+Down       focus down

# Jump to beginning / end of the column or row
# (scroll-specific extension of focus; no Hyprland equivalent)
bindsym $mod+Home       focus begin
bindsym $mod+End        focus end

# Cycle through windows    (replaces: cyclenext / cyclenext prev)
bindsym $mod+grave      focus next sibling
bindsym $mod+Shift+grave focus prev sibling

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW MOVEMENT
# Mirrors:  bind = Super+Shift, left/right/up/down, exec, $dispatch movewin
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym $mod+Shift+Left    move left
bindsym $mod+Shift+Right   move right
bindsym $mod+Shift+Up      move up
bindsym $mod+Shift+Down    move down

# Move to the beginning / end of the row (scroll-specific)
bindsym $mod+Shift+Home    move beginning
bindsym $mod+Shift+End     move end

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW RESIZE
# Mirrors:  binde = Super+Ctrl, left/right/up/down, exec, $dispatch resize
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym $mod+Control+Left   resize shrink width  30px
bindsym $mod+Control+Right  resize grow   width  30px
bindsym $mod+Control+Up     resize shrink height 30px
bindsym $mod+Control+Down   resize grow   height 30px

# Interactive resize mode  (hold $mod+r, use arrows, press Enter/Esc to exit)
mode "resize" {
    bindsym Left   resize shrink width  20px
    bindsym Right  resize grow   width  20px
    bindsym Up     resize shrink height 20px
    bindsym Down   resize grow   height 20px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MOUSE BINDINGS
# floating_modifier handles Super+LMB=move and Super+RMB=resize for float
# Mirrors:  bindm = Super, mouse:272, movewindow / bindm = Super, mouse:273, resizewindow
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
floating_modifier $mod normal

# Scroll wheel over any window → switch workspace
# Mirrors:  bind = Super, mouse_down/up, workspace, e+1/e-1
bindsym --whole-window $mod+button5 workspace next
bindsym --whole-window $mod+button4 workspace prev

# Fast jump to first/last workspace (Ctrl+Super+scroll)
# Mirrors:  bind = Ctrl+Super, mouse_down/up, workspace, -10/+10
bindsym --whole-window Control+$mod+button5 workspace number 9
bindsym --whole-window Control+$mod+button4 workspace number 1

# Middle-button drag scrolls the column strip (scroll-specific, native)
# No config needed; scroll handles Super+middle-drag natively.

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SCROLL-SPECIFIC LAYOUT COMMANDS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Cycle column widths through layout_widths array
# Mirrors:  bind = Super, Slash, layoutmsg, togglesplit  (repurposed)
# Mirrors:  bind = Super, BackSpace, pseudo               (repurposed)
bindsym $mod+BackSpace      cycle_size h prev
bindsym $mod+Shift+BackSpace cycle_size h next

# Cycle window heights through layout_heights array
bindsym $mod+Control+BackSpace      cycle_size v prev
bindsym $mod+Control+Shift+BackSpace cycle_size v next

# Fit columns / windows to screen
#   active      = maximize the focused column to fill the monitor
#   visible     = resize all visible columns proportionally
#   all         = resize all columns in the row equally
# Mirrors:  no direct Hyprland equivalent (was hyprscroller feature)
bindsym $mod+f              fit_size h active proportional
bindsym $mod+Shift+f        fit_size h visible proportional
bindsym $mod+Control+f      fit_size h all equal

# Set working mode for the current workspace
# h = new windows create new columns  (default, like dwindle/scrolling)
# v = new windows stack in the current column  (like master-stack)
# Mirrors:  no direct equivalent (different layouts in Hyprland)
bindsym $mod+Control+h      set_mode h
bindsym $mod+Control+v      set_mode v

# Transpose layout  (swap horizontal ↔ vertical orientation)
bindsym $mod+Control+t      layout_transpose

# Align the active column
#   center  = center column on screen  (useful for reading focus)
#   reset   = return to automatic alignment
bindsym $mod+a              align center
bindsym $mod+Shift+a        align reset

# Pin the active column so it stays visible while others scroll
# (no Hyprland equivalent; scroll-specific)
bindsym $mod+Shift+p        pin

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# OVERVIEW & JUMP
# Replaces:  hyprtasking:toggle  /  hyprexpo  /  pypr expose
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Overview – bird's-eye view of all windows (toggle with same key)
# --no-repeat prevents repeated firing when key is held
# Mirrors:  Super+Tab → hyprtasking:toggle cursor
bindsym --no-repeat $mod+Tab scale_workspace overview

# Also available: side mouse button triggers overview
bindsym --whole-window button8 scale_workspace overview

# Workspace scaling up/down
# Mirrors:  Super+Z / Super+Shift+Z → pypr zoom / zoom reset
bindsym $mod+Shift+comma        scale_workspace incr -0.05
bindsym $mod+Shift+period       scale_workspace incr  0.05
bindsym --whole-window $mod+Shift+button4 scale_workspace incr -0.05
bindsym --whole-window $mod+Shift+button5 scale_workspace incr  0.05
bindsym $mod+Shift+Control+period scale_workspace reset

# Jump mode  –  easymotion-style focus (type letters shown on windows)
# Replaces:  Super+Ctrl+B → pypr expose  /  Super+Tab → hyprexpo
# Use a mode so one key prefix gives access to all jump variants.
mode "jump" {
    # Jump to any tiled window on active workspaces
    bindsym slash      jump; mode "default"
    # Jump within the active column/row
    bindsym c          jump container; mode "default"
    # Preview and jump to any workspace
    bindsym w          jump workspaces; mode "default"
    # Preview and jump to any floating window
    bindsym f          jump floating; mode "default"
    # Preview and jump to all windows across all outputs
    bindsym a          jump all; mode "default"
    # Preview and jump to a scratchpad window
    bindsym s          scratchpad jump; mode "default"
    # Preview and jump to a trailmark
    bindsym t          trailmark jump; mode "default"

    bindsym Escape     mode "default"
}
bindsym $mod+slash mode "jump"

# Quick direct jump (no mode) – jump to any window immediately
# Mirrors:  bind = Super+Ctrl+B → pypr expose
bindsym --no-repeat $mod+Control+b jump

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CONTENT SCALING
# Scales individual window content independently of output scale.
# Replaces:  pypr zoom ++0.5  /  pypr zoom  (reset)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym $mod+period             scale_content incr  0.05
bindsym $mod+comma              scale_content incr -0.05
bindsym --whole-window $mod+button5 scale_content incr  0.05
bindsym --whole-window $mod+button4 scale_content incr -0.05
bindsym $mod+Control+period     scale_content reset
# Map old pypr zoom bindings to content scale too:
bindsym $mod+z                  scale_content incr  0.1
bindsym $mod+Shift+z            scale_content reset

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SCRATCHPAD
# Replaces:  pypr toggle <name>  /  togglespecialworkspace
# Replaces:  bind = Super, minus, movetoworkspace, special:minimized
# Replaces:  bind = Super, equal, togglespecialworkspace, minimized
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Scratchpad leader mode  (replaces: Super+P → submap scratchpads)
mode "scratchpads" {
    bindsym Escape mode "default"

    # Terminal  (replaces: pypr toggle term)
    bindsym t [app_id="scratch_term"]    scratchpad show; mode "default"
    # Yazi      (replaces: pypr toggle yazi)
    bindsym y [app_id="scratch_yazi"]   scratchpad show; mode "default"
    # Lazygit   (replaces: pypr toggle lazygit)
    bindsym l [app_id="scratch_lazygit"] scratchpad show; mode "default"
    # Calculator (replaces: pypr toggle calculator)
    bindsym c [app_id="scratch_calc"]   scratchpad show; mode "default"
    # Spotify   (replaces: pypr toggle spotify)
    bindsym m [app_id="spotify"]        scratchpad show; mode "default"
    # Overview of ALL scratchpad windows  (like scratchpad jump)
    bindsym --no-repeat s               scratchpad jump; mode "default"
}
bindsym $mod+p mode "scratchpads"

# Direct terminal scratchpad toggle  (Mirrors: Super+Shift+Return → pypr toggle term)
bindsym $mod+Shift+Return [app_id="scratch_term"] scratchpad show

# Minimize focused window to scratchpad  (replaces: Super+minus → special:minimized)
bindsym $mod+minus       move scratchpad

# Restore last minimized window  (replaces: Super+equal → togglespecialworkspace)
bindsym $mod+equal       scratchpad show

# Overview of all scratchpad windows  (replaces: Super+S → togglespecialworkspace)
bindsym --no-repeat $mod+s scratchpad show
bindsym --no-repeat $mod+Alt+s scratchpad jump

# Move to/from special  (replaces: Ctrl+Super+Alt+up → special:special)
bindsym Control+$mod+Mod1+Up    move scratchpad
bindsym Control+$mod+Mod1+Down  scratchpad show

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SCREENSHOT
# Replaces:  $screenshot hyprshot variants
# Using grim + slurp + swappy (standard sway screenshot stack)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Region screenshot  (replaces: Alt+Print / Super+Shift+S → hyprshot --region)
bindsym Mod1+Print      exec grim -g "$(slurp -d)" - | swappy -f -
bindsym $mod+Shift+s    exec grim -g "$(slurp -d)" - | swappy -f -

# Fullscreen screenshot  (replaces: Ctrl+Print → hyprshot --fullscreen)
bindsym Control+Print   exec grim - | swappy -f -

# Focused output screenshot
bindsym $mod+Print      exec grim -o "$(scrollmsg -t get_outputs | jq -r '.[] | select(.focused) | .name')" - | swappy -f -

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GUI APPLICATIONS  (Super+G → leader mode)
# Replaces:  Super+G → submap guiapps
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "guiapps" {
    bindsym Escape mode "default"

    bindsym b exec $browser; mode "default"
    bindsym f exec $guifm;   mode "default"
    bindsym e exec $editor;  mode "default"
}
bindsym $mod+g mode "guiapps"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TUI APPLICATIONS  (Super+T → leader mode)
# Replaces:  Super+T → submap tuiapps
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "tuiapps" {
    bindsym Escape mode "default"

    bindsym y exec $terminal -e yazi;  mode "default"
    bindsym b exec $terminal -e btop;  mode "default"
    bindsym e exec $terminal -e nvim;  mode "default"
}
bindsym $mod+t mode "tuiapps"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NOCTALIA LAUNCHERS  (Super+Shift+L → leader mode)
# Replaces:  Super+Shift+L → submap noctalia_launchers
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "noctalia_launchers" {
    bindsym Escape mode "default"

    bindsym v           exec $ipc launcher clipboard; mode "default"
    bindsym w           exec $ipc launcher windows;   mode "default"
    bindsym period      exec $ipc launcher command;   mode "default"
    bindsym Shift+period exec $ipc launcher emoji;    mode "default"
}
bindsym $mod+Shift+l mode "noctalia_launchers"

# Clipboard picker (direct, most-used shortcut)
# Falls back to rofi+cliphist if Noctalia is not available
bindsym $mod+Control+v exec cliphist list | rofi -dmenu -p "clipboard" | cliphist decode | wl-copy

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NOCTALIA CORE INTERFACE  (Super+N → leader mode)
# Replaces:  Super+N → submap noctalia_core
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "noctalia_core" {
    bindsym Escape mode "default"

    bindsym c     exec $ipc controlCenter toggle;              mode "default"
    bindsym comma exec $ipc settings toggle;                   mode "default"
    bindsym a     exec $ipc calendar toggle;                   mode "default"
    bindsym i     exec $ipc systemMonitor toggle;              mode "default"
    bindsym p     exec $ipc plugin togglePanel notes-scratchpad; mode "default"
}
bindsym $mod+n mode "noctalia_core"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NOCTALIA MISC / SYSTEM  (Super+M → leader mode)
# Replaces:  Super+M → submap noctalia_misc  (mixed persistent+one-shot)
# Persistent toggles stay in the mode; one-shot actions exit the mode.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "noctalia_misc" {
    bindsym Escape mode "default"

    # Persistent toggles – stay in mode to allow repeated toggling
    bindsym i exec $ipc idleInhibitor toggle
    bindsym w exec $ipc wifi toggle
    bindsym b exec $ipc bluetooth toggle
    bindsym n exec $ipc nightLight toggle
    bindsym p exec $ipc powerProfile cycle

    # One-shot actions – exit mode immediately after
    bindsym k exec $lock_cmd;                    mode "default"
    bindsym x exec $ipc sessionMenu lockAndSuspend; mode "default"
}
bindsym $mod+m mode "noctalia_misc"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TRAILMARKS  (Super+semicolon → trailmark mode)
# Trails and Trailmarks are scroll-specific features (no Hyprland equivalent).
# A trailmark is an anonymous bookmark on a window.
# A trail is a named collection of trailmarks you can navigate like a history.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "trailmark" {
    # Navigate within the active trail
    bindsym bracketright trailmark next
    bindsym bracketleft  trailmark prev
    # Toggle trailmark on focused window and exit mode
    bindsym semicolon    trailmark toggle; mode "default"

    bindsym Escape mode "default"
}
bindsym $mod+semicolon mode "trailmark"

# Trail management  (Super+Shift+semicolon → trail mode)
mode "trail" {
    # Navigate between trails
    bindsym bracketright trail next
    bindsym bracketleft  trail prev
    # Create a new trail and exit mode
    bindsym semicolon    trail new;        mode "default"
    # Delete the active trail and exit
    bindsym d            trail delete;     mode "default"
    # Clear all trailmarks from active trail and exit
    bindsym c            trail clear;      mode "default"
    # Convert active trail into a selection (for bulk operations)
    bindsym Insert       trail to_selection; mode "default"

    bindsym Escape mode "default"
}
bindsym $mod+Shift+semicolon mode "trail"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# AUDIO & BRIGHTNESS
# --locked ensures these work even on the lock screen
# Mirrors:  bindel/bindl = XF86Audio*/XF86MonBrightness*
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym --locked XF86AudioRaiseVolume  exec $ipc volume increase
bindsym --locked XF86AudioLowerVolume  exec $ipc volume decrease
bindsym --locked XF86AudioMute         exec $ipc volume muteOutput
bindsym --locked XF86AudioMicMute      exec $ipc volume muteInput
bindsym --locked XF86MonBrightnessUp   exec $ipc brightness increase
bindsym --locked XF86MonBrightnessDown exec $ipc brightness decrease

# Media keys (pass-through to focused application)
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LAPTOP LID SWITCH
# Replaces:  bindl = , switch:on/off:Lid Switch, exec, hyprctl keyword monitor
# In your Hyprland config, both on and off events disabled eDP-1.
# scroll uses `bindswitch` for hardware switch events.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Lid closed → disable internal display
bindswitch --reload lid:on  output eDP-1 disable

# Lid opened → keep eDP-1 disabled (you use external monitor in clamshell)
# Change to `output eDP-1 enable` if you want the laptop screen back on lid open
bindswitch --reload lid:off output eDP-1 disable
