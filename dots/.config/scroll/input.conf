# ══════════════════════════════════════════════════════════════════════════════
# input.conf  –  Keyboard, mouse and touchpad configuration
# Mirrors:  settings.conf → input {}  (Hyprland)
#
# Run `scrollmsg -t get_inputs` to list input device identifiers.
# Use `type:keyboard`, `type:pointer`, `type:touchpad` for wildcard matching,
# or use the exact identifier string for device-specific settings.
# ══════════════════════════════════════════════════════════════════════════════

# ── Keyboard ──────────────────────────────────────────────────────────────────
input type:keyboard {
    # Layout and variant
    # Mirrors:  kb_layout = us
    xkb_layout us

    # Remap CapsLock → Ctrl
    # Mirrors:  kb_options = ctrl:nocaps
    xkb_options ctrl:nocaps

    # Enable NumLock at startup
    # Mirrors:  numlock_by_default = true
    xkb_numlock enabled

    # Key repeat settings (sway defaults: 300ms delay, 35 repeats/sec)
    repeat_delay 300
    repeat_rate  35
}

# ── Pointer (all mice) ───────────────────────────────────────────────────────
input type:pointer {
    # Flat acceleration – no acceleration curve applied
    # Mirrors:  accel_profile = flat
    accel_profile flat
    pointer_accel 0
}

# ── Touchpad ──────────────────────────────────────────────────────────────────
input type:touchpad {
    # Tap to click
    tap enabled
    tap_button_map lrm

    # Natural (reverse) scrolling
    # Mirrors:  touchpad { natural_scroll = true }
    natural_scroll enabled

    # Two-finger scrolling
    scroll_method two_finger

    # Flat acceleration on touchpad too
    accel_profile flat

    # Disable-while-typing
    dwt enabled

    # Middle button emulation (three-finger tap)
    middle_emulation enabled
}

# ── Seat / Cursor ─────────────────────────────────────────────────────────────
# Set cursor theme and size to match env vars (Bibata-Modern-Ice, 20px)
# Mirrors:  XCURSOR_THEME=Bibata-Modern-Ice, XCURSOR_SIZE=20
seat seat0 xcursor_theme Bibata-Modern-Ice 20

# ── Focus follows mouse ───────────────────────────────────────────────────────
# Mirrors:  follow_mouse = 1  (focus window under cursor on hover)
focus_follows_mouse yes

# ── Trackpad / mouse gesture scrolling ───────────────────────────────────────
# Enables three-finger swipe to horizontally scroll the column strip.
# Mirrors:  gesture = 3, horizontal, workspace  (Hyprland – workspace switching)
# NOTE: In scroll, gesture scrolling moves columns within the workspace;
# it does not directly switch workspaces (unlike Hyprland). Use Ctrl+Alt+←/→
# or $mod+[/] to switch workspaces with keyboard.
gesture_scroll_enable yes
gesture_scroll_fingers 3
gesture_scroll_sensitivity 1.0
