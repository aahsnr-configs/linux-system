# ══════════════════════════════════════════════════════════════════════════════
# rules.conf  –  Window rules and scratchpad initialization
#
# sway/scroll window criteria:
#   [app_id="..."]           Wayland windows (matches GDK_APPLICATION_ID etc.)
#   [class="..."]            XWayland windows (WM_CLASS)
#   [title="..."]            Window title (supports regex)
#   [shell="xwayland"]       Only XWayland windows
#   [floating]               Any floating window
#   [workspace="N"]          Windows on workspace N
#
# Multiple criteria are ANDed:  [app_id="foo" title="bar"]
# For regex, use:               [app_id="^(foo|bar)$"]
# ══════════════════════════════════════════════════════════════════════════════

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SCRATCHPAD WINDOWS
# Pre-launched in autostart.conf with specific app_ids.
# The for_window rule catches the window on first map and sends it to the scratchpad. Subsequent `scratchpad show` commands toggle visibility.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Terminal scratchpad  (replaces: pypr toggle term)
for_window [app_id="scratch_term"] {
    floating enable
    resize set width 70ppt height 70ppt
    move position center
    move scratchpad
}

# Yazi file manager scratchpad
for_window [app_id="scratch_yazi"] {
    floating enable
    resize set width 70ppt height 70ppt
    move position center
    move scratchpad
}

# Lazygit scratchpad
for_window [app_id="scratch_lazygit"] {
    floating enable
    resize set width 80ppt height 80ppt
    move position center
    move scratchpad
}

# Spotify scratchpad
# Spotify's app_id is "spotify" (native Wayland) or use class for XWayland.
for_window [app_id="spotify"] {
    floating enable
    resize set width 75ppt height 80ppt
    move position center
    move scratchpad
}
# XWayland fallback (flatpak or older install):
for_window [class="Spotify"] {
    floating enable
    resize set width 75ppt height 80ppt
    move position center
    move scratchpad
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FLOATING WINDOWS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Kitty drop-term (the non-scratchpad floating variant)
# Mirrors:  windowrule kitty_floating
for_window [app_id="kitty-dropterm"] {
    floating enable
    resize set width 70ppt height 70ppt
    move position center
}

# Ghostty terminal  (slight transparency via per-window decoration)
# NOTE: scroll's for_window does not support per-window opacity rules.
# Configure background_opacity in Ghostty's own config instead.
for_window [app_id="com.mitchellh.ghostty"] floating disable

# Nautilus file manager
# Mirrors:  windowrule nautilus_floating
for_window [app_id="org.gnome.Nautilus"] {
    floating enable
    resize set 1000 800
    move position center
}

# BleachBit
# Mirrors:  windowrule bleachbit_floating
for_window [app_id="org.bleachbit.BleachBit"] {
    floating enable
    resize set 600 600
    move position center
}

# Thunar file manager (floating, general use)
# Mirrors:  windowrule thunar_floating
for_window [app_id="thunar"] {
    floating enable
    resize set 800 600
    move position center
}

# Thunar file operation progress dialog
# Mirrors:  windowrule Thunar-Progress-bar
for_window [app_id="thunar" title="File Operation Progress"] {
    floating enable
    resize set 420 260
    move position center
}

# Qt5ct / Qt6ct theming dialogs
# Mirrors:  windowrule qt5ct_floating / qt6ct_floating
for_window [app_id="qt5ct"] {
    floating enable
    resize set 800 600
    move position center
}
for_window [app_id="qt6ct"] {
    floating enable
    resize set 800 600
    move position center
}

# nwg-look GTK theme manager
# Mirrors:  windowrule nwg_look
for_window [app_id="nwg-look"] {
    floating enable
    resize set 600 400
    move position center
}

# Brave – Google sign-in / OAuth popup
# Mirrors:  windowrule google_signin_popup
for_window [app_id="brave-browser" title="Untitled - Brave"] {
    floating enable
    resize set 450 600
    move position center
}

# Bitwarden browser extension popup
# Mirrors:  windowrule bitwarden_popup
for_window [class="brave-nngceckbapebfimnlniiiahkandclblb-Default"] {
    floating enable
    resize set 450 600
    move position center
}

# xdg-desktop-portal-gtk (file chooser / open-save dialogs)
# Mirrors:  windowrule xdg_desktop_portal_gtk
for_window [app_id="xdg-desktop-portal-gtk"] {
    floating enable
    resize set 600 600
    move position center
}

# PulseAudio / PipeWire volume control
# Mirrors:  float+resize+center pavucontrol
for_window [app_id="org.pulseaudio.pavucontrol"] {
    floating enable
    resize set width 60ppt height 70ppt
    move position center
}

# yad icon browser
for_window [class="yad-icon-browser"] {
    floating enable
    resize set width 60ppt height 70ppt
    move position center
}

# Image viewer
for_window [app_id="imv"] {
    floating enable
    move position center
}

# Archive managers
# Mirrors:  float file-roller / org.gnome.FileRoller
for_window [app_id="org.gnome.FileRoller"] floating enable
for_window [class="file-roller"]           floating enable

# Miscellaneous floating apps
for_window [class="system-config-printer"] floating enable
for_window [class="CachyOSHello"]          floating enable

# ROG Control Center (ASUS hardware tray app)
for_window [app_id="rog-control-center"] {
    floating enable
    move position center
}

# ── Dialog title patterns ─────────────────────────────────────────────────────
# Mirrors:  windowrule = float true, match:title (Select|Open) ...
for_window [title="^(Select|Open)( a)? (File|Folder)(s)?$"] {
    floating enable
    move position center
}
for_window [title="^File (Operation|Upload)( Progress)?$"] {
    floating enable
    move position center
}
for_window [title=".* Properties$"] {
    floating enable
    move position center
}
for_window [title="^Export Image as PNG$"]  floating enable
for_window [title="^GIMP Crash Debug$"]     floating enable
for_window [title="^Save As$"]              floating enable
for_window [title="^Library$"]              floating enable

# ── Picture-in-Picture ────────────────────────────────────────────────────────
# Mirrors:  windowrule Picture-in-Picture (float, pin, move 72% 7%)
# sticky = stays on all workspaces (replaces Hyprland `pin = on`)
for_window [title="^Picture-in-Picture$"] {
    floating enable
    sticky enable
    resize set width 30ppt height 30ppt
    move position 69ppt 7ppt
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# XWAYLAND POPUP SUPPRESSION
# Mirrors:  windowrule = no_dim/no_shadow/rounding 10, match:xwayland win[0-9]+
# Suppress visual noise from generic Xwayland popup windows.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
for_window [shell="xwayland" title="win[0-9]+"] {
    border none
    decoration border_radius 10 shadow false dim false
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# IDLE INHIBITION
# Prevent the screen from locking when an app is fullscreen.
# Replaces Hyprland's automatic fullscreen idle-inhibit behaviour.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
for_window [app_id=".*"] inhibit_idle fullscreen
