# ══════════════════════════════════════════════════════════════════════════════
# output.conf  –  Monitor / display configuration

# ── HDMI-A-1  (primary external monitor) ─────────────────────────────────────
output HDMI-A-1 {
    mode 2560x1440@60Hz
    position 0 0
    scale 1.25
    # hdr on
}

# ── eDP-1  (internal display – disabled, clamshell / external-only) ──────────
output eDP-1 disable

# ── XWayland output scaling ───────────────────────────────────────────────────
# Makes XWayland apps render at the fractional output scale instead of 1:1.
xwayland_output_scale true
