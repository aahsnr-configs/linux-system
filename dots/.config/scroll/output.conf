# ══════════════════════════════════════════════════════════════════════════════
# output.conf  –  Monitor / display configuration
# Mirrors:  monitor.conf  (Hyprland)
#
# Your setup:  single external HDMI-A-1 @ 2560×1440 60 Hz, scale ≈1.33
#              internal eDP-1 disabled (clamshell / external-only)
#
# Run `scrollmsg -t get_outputs` to list available output names.
# Run `scrollmsg -t get_outputs | jq '.[].modes'` to list available modes.
# ══════════════════════════════════════════════════════════════════════════════

# ── HDMI-A-1  (primary external monitor) ─────────────────────────────────────
output HDMI-A-1 {
    # Resolution & refresh rate
    # Mirrors:  mode = 2560x1440@60  in monitorv2 block
    mode 2560x1440@60Hz

    # Screen position  (top-left origin)
    position 0 0

    # Fractional scale  (your Hyprland scale = 1.33)
    # scroll supports fractional scaling natively via its bundled wlroots.
    scale 1.333333

    # Wallpaper  –  replace path or use a solid color:
    #   background ~/Pictures/wallpaper.jpg fill
    background #1d2021 solid_color

    # ── Scroll-specific layout options (per-output) ───────────────────────
    # These override the global layout_* settings for this specific monitor.

    # Landscape monitor → horizontal layout (columns of windows scroll left/right)
    layout_type horizontal

    # Default column width as a fraction of monitor width
    # Mirrors:  scrolling { column_width = 0.40 }
    layout_default_width 0.40

    # Default window height as a fraction of monitor height (1.0 = full height)
    layout_default_height 1.0

    # Available column widths for cycle_size h next|prev
    # Mirrors:  scrolling { follow_min_visible = 0.33 }  (0.33 is the minimum)
    layout_widths [0.33333333 0.40 0.50 0.60 0.66666667 1.0]

    # Available window heights for cycle_size v next|prev
    layout_heights [0.33333333 0.50 0.66666667 1.0]
}

# ── eDP-1  (internal display – disabled, clamshell / external-only) ──────────
# Mirrors:  monitor = eDP-1, disable
# Also handled by the lid switch bindings in keybindings.conf
output eDP-1 disable

# ── XWayland output scaling ───────────────────────────────────────────────────
# Makes XWayland apps render at the fractional output scale instead of 1:1.
# Mirrors:  xwayland { force_zero_scaling = true }
# (In scroll, this is a top-level option; true = scale XWayland to match output)
xwayland_output_scale true
