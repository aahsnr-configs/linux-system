# ESSENTIALS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym Mod4+d            exec $ipc launcher toggle
bindsym Mod4+x            exec $ipc sessionMenu toggle
bindsym Mod4+Return       exec $terminal
bindsym Mod4+q            kill
bindsym Mod4+space        floating toggle
bindsym Mod4+Shift+space  fullscreen
bindsym Mod4+Shift+r      reload
bindsym Mod4+l            exec $ipc lockScreen lock



# FOCUS NAVIGATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym Mod4+Left         focus left
bindsym Mod4+Right        focus right
bindsym Mod4+Up           focus up
bindsym Mod4+Down         focus down

# Jump to beginning / end of the column or row
bindsym Mod4+Home         focus begin
bindsym Mod4+End          focus end

# Cycle through windows
bindsym Mod4+grave        focus next sibling
bindsym Mod4+Shift+grave  focus prev sibling



# WINDOW MOVEMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym Mod4+Shift+Left    move left
bindsym Mod4+Shift+Right   move right
bindsym Mod4+Shift+Up      move up
bindsym Mod4+Shift+Down    move down

# Move to the beginning / end of the row (scroll-specific)
bindsym Mod4+Shift+Home    move beginning
bindsym Mod4+Shift+End     move end



# WINDOW RESIZE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym Mod4+Control+Left   resize shrink width  50px
bindsym Mod4+Control+Right  resize grow   width  50px
bindsym Mod4+Control+Up     resize shrink height 50px
bindsym Mod4+Control+Down   resize grow   height 50px



# MOUSE BINDINGS
# floating_modifier handles Super+LMB=move and Super+RMB=resize for float
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
floating_modifier Mod4 normal

# Scroll wheel over any window → switch workspace
bindsym --whole-window Mod4+button5 workspace next
bindsym --whole-window Mod4+button4 workspace prev

# Fast jump to first/last workspace (Ctrl+Super+scroll)
bindsym --whole-window Control+Mod4+button5 workspace number 9
bindsym --whole-window Control+Mod4+button4 workspace number 1



# SCROLL-SPECIFIC LAYOUT COMMANDS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Cycle column widths through layout_widths array
bindsym Mod4+BackSpace               cycle_size h prev
bindsym Mod4+Shift+BackSpace         cycle_size h next

# Cycle window heights through layout_heights array
bindsym Mod4+Control+BackSpace       cycle_size v prev
bindsym Mod4+Control+Shift+BackSpace cycle_size v next

# Fit columns / windows to screen
# active   = maximize the focused column to fill the monitor
# visible  = resize all visible columns proportionally
# all      = resize all columns in the row equally
bindsym Mod4+f              fit_size h active proportional
bindsym Mod4+Shift+f        fit_size h visible proportional
bindsym Mod4+Control+f      fit_size h all equal

# Set working mode for the current workspace
# h = new windows create new columns
# v = new windows stack in the current column
bindsym Mod4+Control+h      set_mode h
bindsym Mod4+Control+v      set_mode v

# Transpose layout  (swap horizontal ↔ vertical orientation)
bindsym Mod4+Control+t      layout_transpose

# Align the active column
#   center  = center column on screen
#   reset   = return to automatic alignment
bindsym Mod4+a              align center
bindsym Mod4+Shift+a        align reset

# Pin the active column so it stays visible while others scroll
bindsym Mod4+Shift+p        pin



# OVERVIEW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym --no-repeat Mod4+Tab scale_workspace overview
bindsym --whole-window button8 scale_workspace overview

# Workspace scaling up/down
bindsym Mod4+Shift+comma        scale_workspace incr -0.05
bindsym Mod4+Shift+period       scale_workspace incr  0.05
bindsym --whole-window Mod4+Shift+button4 scale_workspace incr -0.05
bindsym --whole-window Mod4+Shift+button5 scale_workspace incr  0.05
bindsym Mod4+Shift+Control+period scale_workspace reset



# JUMP
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Use a mode so one key prefix gives access to all jump variants.
mode "jump" {
    # Jump to any tiled window on active workspaces
    bindsym slash      jump; mode "default"
    # Jump within the active column/row
    bindsym c          jump container; mode "default"
    # Preview and jump to any workspace
    bindsym w          jump workspaces; mode "default"
    # Preview and jump to any floating window
    bindsym f          jump floating; mode "default"
    # Preview and jump to all windows across all outputs
    bindsym a          jump all; mode "default"
    # Preview and jump to a scratchpad window
    bindsym s          scratchpad jump; mode "default"
    # Preview and jump to a trailmark
    bindsym t          trailmark jump; mode "default"

    bindsym Escape     mode "default"
}
bindsym Mod4+slash mode "jump"

# Quick direct jump (no mode) – jump to any window immediately
bindsym --no-repeat Mod4+Control+b jump



# CONTENT SCALING
# Scales individual window content independently of output scale.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym Mod4+period             scale_content incr  0.05
bindsym Mod4+comma              scale_content incr -0.05
# Use Mod4+Alt+scroll for content scaling (Mod4+scroll is already workspace next/prev)
bindsym --whole-window Mod4+Mod1+button5 scale_content incr  0.05
bindsym --whole-window Mod4+Mod1+button4 scale_content incr -0.05
bindsym Mod4+Control+period     scale_content reset
bindsym Mod4+z                  scale_content incr  0.1
bindsym Mod4+Shift+z            scale_content reset



# SCRATCHPAD
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Scratchpad leader mode
mode "scratchpads" {
    bindsym Escape mode "default"

    # Yazi      (replaces: pypr toggle yazi)
    bindsym y [app_id="scratch_yazi"]   scratchpad show; mode "default"
    # Lazygit   (replaces: pypr toggle lazygit)
    bindsym l [app_id="scratch_lazygit"] scratchpad show; mode "default"
    # Calculator (replaces: pypr toggle calculator)
    bindsym c [app_id="scratch_calc"]   scratchpad show; mode "default"
    # Spotify   (replaces: pypr toggle spotify)
    bindsym m [app_id="spotify"]        scratchpad show; mode "default"
    # Overview of ALL scratchpad windows  (like scratchpad jump)
    bindsym --no-repeat s               scratchpad jump; mode "default"
}
bindsym Mod4+p mode "scratchpads"

# Direct terminal scratchpad toggle
bindsym Mod4+Shift+Return [app_id="scratch_term"] scratchpad show

# Minimize focused window to scratchpad
bindsym Mod4+minus       move scratchpad

# Restore last minimized window
bindsym Mod4+equal       scratchpad show

# Overview of all scratchpad windows
bindsym --no-repeat Mod4+s scratchpad show
bindsym --no-repeat Mod4+Alt+s scratchpad jump

# Move to/from special
bindsym Control+Mod4+Mod1+Up    move scratchpad
bindsym Control+Mod4+Mod1+Down  scratchpad show



# SCREENSHOT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Region screenshot
bindsym Mod1+Print      exec $screenshot --region
bindsym Mod4+Shift+s    exec $screenshot --region

# Fullscreen screenshot
bindsym Control+Print   exec $screenshot --fullscreen



# GUI APPLICATIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "guiapps" {
    bindsym Escape mode "default"

    bindsym b exec $browser; mode "default"
    bindsym f exec $guifm;   mode "default"
    bindsym e exec $editor;  mode "default"
}
bindsym Mod4+g mode "guiapps"



# TUI APPLICATIONS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "tuiapps" {
    bindsym Escape mode "default"

    bindsym y exec $terminal -e yazi;  mode "default"
    bindsym b exec $terminal -e btop;  mode "default"
    bindsym e exec $terminal -e nvim;  mode "default"
}
bindsym Mod4+t mode "tuiapps"



# NOCTALIA LAUNCHERS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "noctalia_launchers" {
    bindsym Escape mode "default"

    bindsym v           exec $ipc launcher clipboard; mode "default"
    bindsym w           exec $ipc launcher windows;   mode "default"
    bindsym period      exec $ipc launcher command;   mode "default"
    bindsym Shift+period exec $ipc launcher emoji;    mode "default"
}
bindsym Mod4+Shift+l mode "noctalia_launchers"



# NOCTALIA CORE INTERFACE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "noctalia_core" {
    bindsym Escape mode "default"

    bindsym c     exec $ipc controlCenter toggle;              mode "default"
    bindsym comma exec $ipc settings toggle;                   mode "default"
    bindsym a     exec $ipc calendar toggle;                   mode "default"
    bindsym i     exec $ipc systemMonitor toggle;              mode "default"
    bindsym p     exec $ipc plugin togglePanel notes-scratchpad; mode "default"
}
bindsym Mod4+n mode "noctalia_core"



# NOCTALIA MISC / SYSTEM
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "noctalia_misc" {
    bindsym Escape mode "default"

    # Persistent toggles – stay in mode to allow repeated toggling
    bindsym i exec $ipc idleInhibitor toggle
    bindsym w exec $ipc wifi toggle
    bindsym b exec $ipc bluetooth toggle
    bindsym n exec $ipc nightLight toggle
    bindsym p exec $ipc powerProfile cycle

    # One-shot actions – exit mode immediately after
    bindsym k exec $lock_cmd;                    mode "default"
    bindsym x exec $ipc sessionMenu lockAndSuspend; mode "default"
}
bindsym Mod4+m mode "noctalia_misc"



# TRAILMARKS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
mode "trailmark" {
    # Navigate within the active trail
    bindsym bracketright trailmark next
    bindsym bracketleft  trailmark prev
    # Toggle trailmark on focused window and exit mode
    bindsym semicolon    trailmark toggle; mode "default"

    bindsym Escape mode "default"
}
bindsym Mod4+semicolon mode "trailmark"

# Trail management  (Super+Shift+semicolon → trail mode)
mode "trail" {
    # Navigate between trails
    bindsym bracketright trail next
    bindsym bracketleft  trail prev
    # Create a new trail and exit mode
    bindsym semicolon    trail new;        mode "default"
    # Delete the active trail and exit
    bindsym d            trail delete;     mode "default"
    # Clear all trailmarks from active trail and exit
    bindsym c            trail clear;      mode "default"
    # Convert active trail into a selection (for bulk operations)
    bindsym Insert       trail to_selection; mode "default"

    bindsym Escape mode "default"
}
bindsym Mod4+Shift+semicolon mode "trail"



# AUDIO & BRIGHTNESS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindsym --locked XF86AudioRaiseVolume  exec $ipc volume increase
bindsym --locked XF86AudioLowerVolume  exec $ipc volume decrease
bindsym --locked XF86AudioMute         exec $ipc volume muteOutput
bindsym --locked XF86AudioMicMute      exec $ipc volume muteInput
bindsym --locked XF86MonBrightnessUp   exec $ipc brightness increase
bindsym --locked XF86MonBrightnessDown exec $ipc brightness decrease

# Media keys (pass-through to focused application)
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous



# LAPTOP LID SWITCH
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Lid closed → disable internal display
bindswitch --reload lid:on  output eDP-1 disable

# Lid opened → keep eDP-1 disabled (you use external monitor in clamshell)
# Change to `output eDP-1 enable` if you want the laptop screen back on lid open
bindswitch --reload lid:off output eDP-1 disable
