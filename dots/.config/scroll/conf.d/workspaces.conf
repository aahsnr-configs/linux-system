# ════════════════════════════════════════════════════════════
# workspaces.conf  –  Workspace assignments and switching keybindings

# ── Workspace assignments  ──────────────────────────────────
workspace 1 output HDMI-A-1
workspace 2 output HDMI-A-1
workspace 3 output HDMI-A-1
workspace 4 output HDMI-A-1
workspace 5 output HDMI-A-1
workspace 6 output HDMI-A-1
workspace 7 output HDMI-A-1
workspace 8 output HDMI-A-1
workspace 9 output HDMI-A-1

# ── Switch to workspace  (Super+1…9) ─────────────────────────────────────────
bindsym Mod4+1 workspace number 1
bindsym Mod4+2 workspace number 2
bindsym Mod4+3 workspace number 3
bindsym Mod4+4 workspace number 4
bindsym Mod4+5 workspace number 5
bindsym Mod4+6 workspace number 6
bindsym Mod4+7 workspace number 7
bindsym Mod4+8 workspace number 8
bindsym Mod4+9 workspace number 9

# ── Move focused window to workspace  (Super+Shift+1…9) ──────────────────────
bindsym Mod4+Shift+1 move container to workspace number 1
bindsym Mod4+Shift+2 move container to workspace number 2
bindsym Mod4+Shift+3 move container to workspace number 3
bindsym Mod4+Shift+4 move container to workspace number 4
bindsym Mod4+Shift+5 move container to workspace number 5
bindsym Mod4+Shift+6 move container to workspace number 6
bindsym Mod4+Shift+7 move container to workspace number 7
bindsym Mod4+Shift+8 move container to workspace number 8
bindsym Mod4+Shift+9 move container to workspace number 9

# ── Relative workspace switching (Ctrl+Alt+←/→) ────────────────────────────
bindsym Ctrl+Alt+Right workspace next
bindsym Ctrl+Alt+Left  workspace prev

# ── Bracket navigation (Super+[  /  Super+]) ────────────────────────────────
# focus next/prev non-empty workspace on the current output
bindsym Mod4+bracketright workspace next_on_output
bindsym Mod4+bracketleft  workspace prev_on_output

# Move window to adjacent workspace
bindsym Mod4+Shift+bracketright move container to workspace next; workspace next
bindsym Mod4+Shift+bracketleft  move container to workspace prev; workspace prev

# ── Workspace split (scroll-specific) ────────────────────────────────────────
# Shows two workspaces side-by-side on ultra-wide monitors.
bindsym Mod4+Shift+Tab workspace split
