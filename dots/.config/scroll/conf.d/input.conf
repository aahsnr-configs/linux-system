# ═════════════════════════════════════════════════════════
# input.conf  –  Keyboard, mouse and touchpad configuration

# ── Keyboard ───────────────────────────────────────────────────────
input type:keyboard {
    xkb_layout "us,us"   
    xkb_options ctrl:nocaps
    xkb_numlock disabled
    repeat_delay 300
    repeat_rate  35
}

# ── Pointer (all mice) ───────────────────────────────────────────────────────
input type:pointer {
    accel_profile flat
    pointer_accel 0
}

# ── Touchpad ───────────────────────────────────────────────────────
input type:touchpad {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    scroll_method two_finger
    accel_profile flat
    dwt enabled
    middle_emulation enabled
}

# ── Seat / Cursor ───────────────────────────────────────────────────────
# Set cursor theme and size to match env vars (Bibata-Modern-Ice, 20px)
seat seat0 xcursor_theme Bibata-Modern-Ice 20

# ── Focus follows mouse ───────────────────────────────────────────────────────
#focus_follows_mouse yes
focus_follows_mouse full

# ── Trackpad / mouse gesture scrolling ───────────────────────────────────────────────────────
# Enables three-finger swipe to horizontally scroll the column strip.
gesture_scroll_enable yes
gesture_scroll_fingers 3
gesture_scroll_sensitivity 1.0
