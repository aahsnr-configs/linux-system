# ══════════════════════════════════════════════════════════════════════════════
# appearance.conf  –  Borders, gaps, decoration, colors, animations
# Mirrors:  settings.conf → general {}, decoration {}, animations {}  (Hyprland)
# ══════════════════════════════════════════════════════════════════════════════

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GAPS
# gaps_in  = 4  →  gaps inner 4
# gaps_out = 7  →  gaps outer 7
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
gaps inner 4
gaps outer 7

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BORDERS
# border_size = 3  →  default_border pixel 3
# Hyprland has no title bars by default; keep pixel borders only.
# titlebar_border_radius applies if any window ever gets a title bar.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
default_border pixel 3
default_floating_border pixel 3
titlebar_border_radius 8

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DECORATION  (scroll-specific)
# Replaces Hyprland's decoration {} block:
#   rounding = 8       → border_radius 8
#   shadow { range=2, render_power=1, color=#1a1a1aee }  → shadow_size/blur/color
#   dim_inactive = false  → dim false
#
# This is a SINGLE COMMAND on one line — scroll does not support line continuation.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
default_decoration border_radius 8 shadow true shadow_dynamic true shadow_size 20 shadow_blur 10 shadow_offset 0 2 shadow_color #1a1a1aee dim false dim_color #00000030

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WINDOW COLORS  (Gruvbox dark palette, matching your Hyprland border colors)
# Format:  client.<state> <border> <background> <text> <indicator> <child_border>
#
# Hyprland active border:   rgba(b8bb26ff) → rgba(fabd2fff)  (gruvbox yellow/gold)
# Hyprland inactive border: rgba(3c3836cc) → rgba(504945cc)  (gruvbox dark grey)
# scroll uses per-role solid colors (no gradient border support).
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Focused window in the focused container  –  gruvbox bright yellow border
client.focused          #b8bb26 #282828 #ebdbb2 #fabd2f #b8bb26

# Focused window in an unfocused container
client.focused_inactive #504945 #3c3836 #a89984 #504945 #504945

# Unfocused / background windows
client.unfocused        #3c3836 #1d2021 #928374 #3c3836 #3c3836

# Urgent / attention-required windows
client.urgent           #cc241d #cc241d #ebdbb2 #cc241d #cc241d

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ANIMATIONS  (scroll-specific block)
#
# Replaces Hyprland's animations {} block.
#
# Format per animation line:
#   <event_name> <yes|no> <duration_ms> var simple [ cp1x cp1y cp2x cp2y ]
#
# "var simple" creates a standard CSS-compatible cubic Bézier.
# Control points correspond to your Hyprland bezier definitions:
#
#   Hyprland bezier "wind"   0.05, 0.9, 0.1, 1.05  → slight overshoot, snappy
#   Hyprland bezier "winIn"  0.1,  1.1, 0.1, 1.1   → bouncy open
#   Hyprland bezier "liner"  1,    1,   1,   1      → linear
#
# Duration = Hyprland frame-count × 16.67ms:
#   4 frames × 16.67ms ≈ 67ms → rounded to 70ms (windows/fade)
#   5 frames × 16.67ms ≈ 83ms → rounded to 90ms (workspaces)
#
# Valid scroll animation event names:
#   default          – fallback for any unspecified event
#   window_open      – window appears  (Hyprland: windowsIn)
#   window_move      – window moves / column scrolls  (Hyprland: windowsMove)
#   window_size      – window resizes  (Hyprland: windows resize)
#   workspace_switch – workspace change  (Hyprland: workspaces)
#   window_fullscreen– fullscreen transition  (no direct Hyprland equivalent)
#   window_move_float– floating window movement  (optional)
#   overview         – scale_workspace overview animation  (optional)
#   jump             – jump mode entry  (optional)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
animations {
    enabled yes

    # Default fallback  –  "wind" bezier (snappy with slight overshoot)
    default          yes  300  var simple [ 0.05  0.9  0.1  1.05 ]

    # Window open  –  "winIn" bezier (bouncy entry, like Hyprland windowsIn popin)
    window_open      yes  250  var simple [ 0.1   1.1  0.1  1.1  ]

    # Window move / column scroll  –  "wind" bezier
    window_move      yes  300  var simple [ 0.05  0.9  0.1  1.05 ]

    # Window resize  –  "wind" bezier (smooth, used for cycle_size)
    window_size      yes  250  var simple [ 0.05  0.9  0.1  1.05 ]

    # Workspace switch  –  "wind" bezier, slightly longer
    # Mirrors:  animation = workspaces, 1, 5, wind, slidevert
    workspace_switch yes  350  var simple [ 0.05  0.9  0.1  1.05 ]

    # Fullscreen transition
    window_fullscreen yes 350  var simple [ 0.3   0.5  0.4  1.0  ]
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# JUMP MODE LABEL STYLING
# These style the easymotion-style letter labels shown during `jump` mode.
# Replaces hyprtasking's visual overlay.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Label text color  (gruvbox bright yellow, semi-transparent)
jump_labels_color      #b8bb26cc
# Label background fill color  (near-black, semi-transparent)
jump_labels_background #1d202180
# Label size as a fraction of the window area (0.5 = 50%)
jump_labels_scale      0.5
# Keys used to generate label combinations
jump_labels_keys       1234567890

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SCROLL-SPECIFIC BEHAVIOUR OPTIONS
# These are scroll additions not present in sway. See: man 5 scroll
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# How to handle focus when a window requests activation
# Mirrors:  misc { focus_on_activate = true }
focus_on_window_activation focus

# Automatic alignment reset on focus change
# no = keep manual alignment until you call `align reset` (default, like hyprscroller)
# yes = reset alignment every time focus changes
# Mirrors:  scrolling { fullscreen_on_one_column = false }  (no forced alignment)
align_reset_auto no

# Keep focus on fullscreen window when switching focus
# Mirrors:  misc { focus_on_activate }
fullscreen_movefocus yes

# Do NOT auto-maximize if only one window is on the workspace
maximize_if_single false

# Disable cycle_size wrapping (reaching last size stops, does not loop back)
cycle_size_wrap false

# Allow XWayland apps to scale with the output fractional scale
# Mirrors:  xwayland { force_zero_scaling = true }
xwayland_output_scale true

# Create an empty workspace when a new output is connected
workspace_next_on_output_create_empty true

# Focus wrapping behaviour across columns/rows
focus_wrapping no
