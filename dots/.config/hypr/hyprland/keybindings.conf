# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# NOTE: 
# - Noctalia keybindings do not need app2unit as it is run as a  service
# - emacsclient keybind does not need app2unit as long as emacs systemd service launches after graphical target; emacs systemd user service will be launched after graphical session starts
# - pypr-client needs app2unit
# - used app2unit in hyprshot script (Recommended)
# - app2unit declared in variables instead of keybindings directly

# Variables
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$terminal = kitty
$browser = brave-browser 
$guifm = nautilus
$tuifm = kitty -e yazi
$editor = emacsclient -c -a 'emacs'
$ipc = qs -c noctalia-shell ipc call
$screenshot = ~/bin/hyprshot
$pypr = /usr/local/bin/pypr-client

# Essentials
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, D, exec, $ipc launcher toggle
bind = Super, Q, killactive
bind = Super, E, exec, $editor
bind = Super, Space, togglefloating
bind = Super+Shift, Space, fullscreen, 1

bind = SUPER, Tab, hyprtasking:toggle, cursor

# Screenshot
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Alt, Print, exec,  $screenshot --region 
bind = Ctrl, Print, exec, $screenshot --fullscreen 
bind = Super+Shift, S, exec, $screenshot --region 

# Applications
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, Return, exec, $terminal
bind = Super+Shift, Return, exec, $pypr toggle term
bind = Super, B, exec, $browser
bind = Super, F, exec, $guifm
bind = Super, Y, exec, $tuifm

# bind = Super, Z, exec, zotero

# Pyprland
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super+Ctrl, B, exec, $pypr expose
bind = Super, Z, exec, $pypr zoom ++0.5
bind = Super+Shift, Z, exec, $pypr zoom

# Layout Center navigation
bind = Super, M, exec, $pypr layout_center toggle
bind = Super+Alt, left,  exec, $pypr layout_center prev
bind = Super+Alt, right, exec, $pypr layout_center next
bind = Super+Alt, up,    exec, $pypr layout_center prev2
bind = Super+Alt, down,  exec, $pypr layout_center next2

# Toggle Special - move windows to/from special workspace
# bind = Super, T, exec, $pypr toggle_special stash
# bind = Super+Shift, T, togglespecialworkspace, stash
#
# NOCTALIA SHELL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Launchers and Menu 
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, V, exec, $ipc launcher clipboard
bind = Super, W, exec, $ipc launcher windows
bind = Super, Period, exec, $ipc launcher command
bind = Super+Shift, Period, exec, $ipc launcher emoji

# Core Interface
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, C, exec, $ipc controlCenter toggle
bind = Super, Comma, exec, $ipc settings toggle
bind = Super, A, exec, $ipc calendar toggle
bind = Super, I, exec, $ipc systemMonitor toggle
bind = Super, Escape, exec, $ipc sessionMenu toggle

# Misc
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super+Shift, I, exec, $ipc idleInhibitor toggle
bind = Super+Shift, K, exec, $ipc lockScreen lock
bind = Super+Shift, W, exec, $ipc wifi toggle
bind = Super+Shift, B, exec, $ipc bluetooth toggle
bind = Super, N, exec, $ipc plugin togglePanel notes-scratchpad
bind = Super+Shift, N, exec, $ipc nightLight toggle
bind = Super+Shift, P, exec, $ipc powerProfile cycle
bind = Super, X, exec, $ipc sessionMenu toggle
bind = Super+Shift, X, exec, $ipc sessionMenu lockAndSuspend


# HYPRLAND CORE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Core
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, P, pseudo
bind = Super, Slash, togglesplit
bind = Super, S, togglespecialworkspace
bind = Super+Shift, R, exec, hyprctl reload                   

# Focus & Movement
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Focus
bind = Super, left,  movefocus, l
bind = Super, right, movefocus, r
bind = Super, up,    movefocus, u
bind = Super, down,  movefocus, d

# Move Window
bind = Super+Shift, left,  movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up,    movewindow, u
bind = Super+Shift, down,  movewindow, d

# Resize Window 
bind = Super+Ctrl, left,  resizeactive, -60 0
bind = Super+Ctrl, right, resizeactive, 60 0
bind = Super+Ctrl, up,    resizeactive, 0 -60
bind = Super+Ctrl, down,  resizeactive, 0 60


# WORKSPACES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Switch Workspaces

# Relative Switching
binde = Ctrl+Alt, right, workspace, +1
binde = Ctrl+Alt, left, workspace, -1

# Mouse Scrolling
bind = Ctrl+Super, mouse_down, workspace, -10
bind = Ctrl+Super, mouse_up, workspace, +10
bind = Super, mouse_down, workspace, e+1
bind = Super, mouse_up, workspace, e-1

# Move/resize with mouse
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow

# Special Workspace
bind = Ctrl+Super+Alt, up, movetoworkspace, special:special
bind = Ctrl+Super+Alt, down, movetoworkspace, e+0
bind = Super+Alt, S, movetoworkspace, special:special

# Audio & Brightness (Noctalia IPC)
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindl = , XF86AudioMicMute, exec, $ipc volume muteInput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# Laptop Lid
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindl = , switch:Lid Switch, exec, $ipc lockScreen lock 
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1"

