monitorv2 {
    output = HDMI-A-1
    mode = 2560x1440@60
    position = 0x0
    scale = 1.33
    bitdepth = 8
    cm = srgb              # stay in sRGB for desktop — correct colors, no yellow
    sdrbrightness = 1.0
    sdrsaturation = 1.0
    supports_hdr = true
    supports_wide_color = true
    sdr_min_luminance = 0.005
    sdr_max_luminance = 250
    min_luminance = 0
    max_luminance = 1000
    max_avg_luminance = 300
}

render {
    cm_fs_passthrough = 2  # back to 2 — monitor is in SDR, auto-switch to HDR for fullscreen
    cm_auto_hdr = 2        # triggers the actual HDR switch when an HDR app goes fullscreen
}

