plugin {
  hy3 {
    tabs {
      height = 22
      padding = 6
      render_text = false
    }
    autotile {
      enable = true
      trigger_width = 600
      trigger_height = 200
    }
  }

  scroller {
      column_default_width = threeeighths
      focus_wrap = false
      column_widths = onefourth onethird onehalf onesixth
      center_active_column = false
      center_active_window = false
  }

    hyprtasking {
        layout = grid

        gap_size = 5
        bg_color = 0xff26233a
        border_size = 4
        exit_on_hovered = false
        warp_on_move_window = 1
        close_overview_on_reload = true

        drag_button = 0x110 # left mouse button
        select_button = 0x111 # right mouse button
        # for other mouse buttons see <linux/input-event-codes.h>

        gestures {
            enabled = true
            move_fingers = 3
            move_distance = 300
            open_fingers = 4
            open_distance = 300
            open_positive = true
        }

        grid {
            rows = 3
            cols = 3
            loop = false
            gaps_use_aspect_ratio = false
        }

        linear {
            height = 400
            scroll_speed = 1.0
            blur = false
        }
    }


  # hyprexpo {
  #     columns = 3
  #     gap_size = 5
  #     bg_col = rgb(111111)
  #     workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1
  #
  #     gesture_distance = 300 # how far is the "max" for the gesture
  # }

}
