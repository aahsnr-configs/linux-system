plugin {
  hy3 {
    tabs {
      height = 22
      padding = 6
      render_text = false
    }
    autotile {
      enable = true
      trigger_width = 600
      trigger_height = 200
    }
  }

  scroller {
      column_default_width = threeeighths
      focus_wrap = false
      column_widths = onefourth onethird onehalf onesixth
      center_active_column = false
      center_active_window = false
  }
}
