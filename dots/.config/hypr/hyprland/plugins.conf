plugin {
  hy3 {
    tabs {
      height = 22
      padding = 6
      render_text = false
    }
    autotile {
      enable = true
      trigger_width = 600
      trigger_height = 200
    }
  }
  hyprexpo {
     columns = 3
     gap_size = 5
     bg_col = rgb(111111)
     workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1
  }
  scroller {
      column_default_width = threeeighths
      focus_wrap = false
      column_widths = onefourth onethird onehalf onesixth
      center_active_column = false
      center_active_window = false
  }
}
