# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Keybindings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# NOTE:
# - Noctalia keybindings do not need app2unit as it is run as a service
# - emacsclient keybind does not need app2unit as long as emacs systemd service
#   launches after graphical target; emacs systemd user service will be launched
#   after graphical session starts
# - pypr-client needs app2unit
# - used app2unit in hyprshot script (Recommended)
# - app2unit declared in variables instead of keybindings directly
# - v0.54 BREAKING: togglesplit/swapsplit removed — use layoutmsg, togglesplit
#
# SUBMAP BEHAVIOUR NOTES:
# - PERSISTENT submaps (scratchpads, guiapps, tuiapps, noctalia_launchers,
#   noctalia_core, noctalia_misc*): the submap stays open after each action
#   fires, allowing you to press the same key multiple times (e.g. press I to
#   toggle a panel ON, press I again to toggle it OFF) without re-invoking the
#   leader. This mirrors sxhkd's ":" persistent chord chain.
# - MIXED submap (noctalia_misc): most binds are persistent (toggles), but K
#   and X are one-shot — they pair a submap, reset immediately after the action
#   because locking the screen or suspending has no meaningful follow-up.
# - ONE-SHOT pattern: pair submap, reset on a second line after the action bind.
#   Hyprland executes multiple binds on the same key in order, so the action
#   fires first, then the submap resets immediately after.
# - Exit any persistent submap explicitly with Escape or any unbound key via
#   catchall.
# - All catchall lines use bindr (release-triggered) to prevent modifier keys
#   from prematurely collapsing the submap before the second key is pressed.


# Variables
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$terminal   = kitty
$browser    = brave-browser
$guifm      = thunar
$editor     = emacsclient -c -a 'emacs'
$ipc        = qs -c noctalia-shell ipc call
$screenshot = ~/bin/hyprshot
$pypr       = /usr/local/bin/pypr-client


# ESSENTIALS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, D,            exec, $ipc launcher toggle
bind = Super, X,            exec, $ipc sessionMenu toggle
bind = Super, Return,       exec, $terminal
bind = Super+Shift, Return, exec, $pypr toggle term
bind = Super, Q,            killactive
bind = Super, Space,        togglefloating
bind = Super+Shift, Space,  fullscreen, 1
bind = Super, S,            togglespecialworkspace
bind = Super+Shift, R,      exec, hyprctl reload

# Focus cycling
# NOTE: Hyprland has no native MRU focuslast dispatcher; cyclenext is the
# closest approximation for mangowc's focuslast and focusstack binds
bind = Super, grave,      cyclenext
bind = Alt,   grave,      cyclenext
bind = Super, Tab,        cyclenext
bind = Super+Shift, Tab,  cyclenext, prev
#bind = Alt, Tab, hyprtasking:toggle, cursor  # mangowc: toggleoverview — requires hyprtasking plugin


# SCREENSHOT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Alt, Print,     exec, $screenshot --region
bind = Ctrl, Print,    exec, $screenshot --fullscreen
bind = Super+Shift, S, exec, $screenshot --region


# SCRATCHPADS SUBMAP  (Super+P → leader | PERSISTENT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Press a key to toggle a scratchpad — press the same key again to toggle it
# back. Submap stays open so you can open/close multiple scratchpads in one
# session without re-invoking the leader.
# Exit with Escape or any unbound key via catchall.
# mangowc equivalent: bind=SUPER,P,setkeymode,scratchpads
# Pypr must have matching scratchpad entries configured in pyprland.toml
bind = Super, P, submap, scratchpads

submap = scratchpads
bind  = , Escape, submap, reset

bind  = , C, exec, $pypr toggle calculator
bind  = , M, exec, $pypr toggle spotify
bind  = , T, exec, $pypr toggle term
bind  = , Y, exec, $pypr toggle yazi
bind  = , L, exec, $pypr toggle lazygit
bind  = , F, exec, $pypr toggle files

bindr = , catchall, submap, reset
submap = reset


# GUI APPLICATIONS SUBMAP  (Super+G → leader | PERSISTENT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Launch multiple GUI apps in sequence without re-invoking the leader.
# Exit with Escape or any unbound key via catchall.
# mangowc equivalent: bind=SUPER,G,setkeymode,guiapps
bind = Super, G, submap, guiapps

submap = guiapps
bind  = , Escape, submap, reset

bind  = , B, exec, $browser
bind  = , F, exec, $guifm
bind  = , E, exec, $editor

bindr = , catchall, submap, reset
submap = reset


# TUI APPLICATIONS SUBMAP  (Super+T → leader | PERSISTENT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Launch multiple TUI apps in sequence without re-invoking the leader.
# Exit with Escape or any unbound key via catchall.
# mangowc equivalent: bind=SUPER,T,setkeymode,tuiapps
bind = Super, T, submap, tuiapps

submap = tuiapps
bind  = , Escape, submap, reset

bind  = , Y, exec, kitty -e yazi
bind  = , B, exec, kitty -e btop
bind  = , E, exec, kitty -e nvim

bindr = , catchall, submap, reset
submap = reset


# NOCTALIA LAUNCHERS SUBMAP  (Super+L → leader | PERSISTENT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Press a launcher key to open it — press the same key again to close/toggle it.
# Submap stays open so you can change your mind or re-invoke.
# Exit with Escape or any unbound key via catchall.
# mangowc equivalent: bind=SUPER,L,setkeymode,noctalia_launchers
bind = Super, L, submap, noctalia_launchers

submap = noctalia_launchers
bind  = , Escape,  submap, reset

bind  = , D,      exec, $ipc launcher toggle
bind  = , V,      exec, $ipc launcher clipboard
bind  = , W,      exec, $ipc launcher windows
bind  = , Period, exec, $ipc launcher command

bind  = SHIFT, Period, exec, $ipc launcher emoji

bindr = , catchall, submap, reset
submap = reset


# NOCTALIA CORE INTERFACE SUBMAP  (Super+N → leader | PERSISTENT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Press a key to toggle a panel ON — press the same key again to toggle it OFF.
# This is the core reason all noctalia submaps are persistent: Hyprland's submap
# system has no state awareness, so the only way to press the same key twice
# (toggle on, then toggle off) without re-invoking the leader is to keep the
# submap alive between presses.
# Notes scratchpad panel kept here as P (was Super+N direct bind previously).
# Exit with Escape or any unbound key via catchall.
# mangowc equivalent: bind=SUPER,N,setkeymode,noctalia_core
bind = Super, N, submap, noctalia_core

submap = noctalia_core
bind  = , Escape, submap, reset

bind  = , C,     exec, $ipc controlCenter toggle
bind  = , Comma, exec, $ipc settings toggle
bind  = , A,     exec, $ipc calendar toggle
bind  = , I,     exec, $ipc systemMonitor toggle
bind  = , P,     exec, $ipc plugin togglePanel notes-scratchpad

bindr = , catchall, submap, reset
submap = reset


# NOCTALIA MISC SUBMAP  (Super+M → leader | MIXED)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PERSISTENT binds (no submap, reset after action): genuine toggles that you
# may want to flip on and then flip off without re-invoking the leader —
# wifi, bluetooth, nightLight, idleInhibitor, powerProfile.
# ONE-SHOT binds (submap, reset paired after action): terminal/destructive
# actions where there is no meaningful follow-up — locking the screen or
# suspending. The submap exits immediately after firing.
# wifi, bluetooth, nightLight retained here from original Hyprland config.
# Exit with Escape or any unbound key via catchall.
# mangowc equivalent: bind=SUPER,M,setkeymode,noctalia_misc
#
# ONE-SHOT PATTERN REFERENCE (copy-paste template):
# ┌─ To make any bind one-shot, pair submap, reset immediately after the action:
# │
# │  bind = , <KEY>, exec, <command>   ← action fires
# │  bind = , <KEY>, submap, reset     ← submap exits immediately after
# │
# └─ Without the second line the submap stays open (persistent behaviour).
bind = Super, M, submap, noctalia_misc

submap = noctalia_misc
bind  = , Escape, submap, reset

# Persistent — toggles you may want to reverse without re-invoking the leader
bind  = , I, exec, $ipc idleInhibitor toggle
bind  = , W, exec, $ipc wifi toggle
bind  = , B, exec, $ipc bluetooth toggle
bind  = , N, exec, $ipc nightLight toggle
bind  = , P, exec, $ipc powerProfile cycle

# One-shot — terminal/destructive actions with no meaningful follow-up
bind  = , K, exec, $ipc lockScreen lock
bind  = , K, submap, reset

bind  = , X, exec, $ipc sessionMenu lockAndSuspend
bind  = , X, submap, reset

bindr = , catchall, submap, reset
submap = reset


# PYPRLAND  (Hyprland-specific extras)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super+Ctrl, B,  exec, $pypr expose
bind = Super, Z,       exec, $pypr zoom ++0.5
bind = Super+Shift, Z, exec, $pypr zoom


# HYPRLAND CORE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, BackSpace, pseudo                    # dwindle: pseudo-tile (moved from Super+P, now used as scratchpads leader)
bind = Super, Slash,     layoutmsg, togglesplit    # dwindle: toggle split (v0.54: layoutmsg replaces bare togglesplit)


# FOCUS & MOVEMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Focus
bind = Super, left,  movefocus, l
bind = Super, right, movefocus, r
bind = Super, up,    movefocus, u
bind = Super, down,  movefocus, d

# Move Window
bind = Super+Shift, left,  movewindow, l
bind = Super+Shift, right, movewindow, r
bind = Super+Shift, up,    movewindow, u
bind = Super+Shift, down,  movewindow, d

# Resize Window
bind = Super+Ctrl, left,  resizeactive, -60 0
bind = Super+Ctrl, right, resizeactive,  60 0
bind = Super+Ctrl, up,    resizeactive,  0 -60
bind = Super+Ctrl, down,  resizeactive,  0  60


# WORKSPACES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Switch to workspace  (mangowc: view)
bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super, 6, workspace, 6
bind = Super, 7, workspace, 7
bind = Super, 8, workspace, 8
bind = Super, 9, workspace, 9

# Move window to workspace silently, view stays  (mangowc: tagsilent)
bind = Super+Shift, 1, movetoworkspacesilent, 1
bind = Super+Shift, 2, movetoworkspacesilent, 2
bind = Super+Shift, 3, movetoworkspacesilent, 3
bind = Super+Shift, 4, movetoworkspacesilent, 4
bind = Super+Shift, 5, movetoworkspacesilent, 5
bind = Super+Shift, 6, movetoworkspacesilent, 6
bind = Super+Shift, 7, movetoworkspacesilent, 7
bind = Super+Shift, 8, movetoworkspacesilent, 8
bind = Super+Shift, 9, movetoworkspacesilent, 9

# Move window to workspace and follow  (mangowc: tag)
bind = Super+Alt, 1, movetoworkspace, 1
bind = Super+Alt, 2, movetoworkspace, 2
bind = Super+Alt, 3, movetoworkspace, 3
bind = Super+Alt, 4, movetoworkspace, 4
bind = Super+Alt, 5, movetoworkspace, 5
bind = Super+Alt, 6, movetoworkspace, 6
bind = Super+Alt, 7, movetoworkspace, 7
bind = Super+Alt, 8, movetoworkspace, 8
bind = Super+Alt, 9, movetoworkspace, 9

# Relative switching
binde = Ctrl+Alt, right, workspace, +1
binde = Ctrl+Alt, left,  workspace, -1

# Bracket navigation  (mangowc: viewtoleft/right_have_client, tagtoleft/right)
bind = Super, bracketleft,        workspace, e-1      # focus prev non-empty workspace
bind = Super, bracketright,       workspace, e+1      # focus next non-empty workspace
bind = Super+Shift, bracketleft,  movetoworkspace, -1 # move window to prev workspace
bind = Super+Shift, bracketright, movetoworkspace, +1 # move window to next workspace


# MOUSE SCROLLING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Ctrl+Super, mouse_down, workspace, -10
bind = Ctrl+Super, mouse_up,   workspace, +10
bind = Super, mouse_down,      workspace, e+1
bind = Super, mouse_up,        workspace, e-1

# Move/resize with mouse
bindm = Super, mouse:272, movewindow
bindm = Super, mouse:273, resizewindow


# SPECIAL WORKSPACE & MINIMIZE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bind = Super, minus,          movetoworkspace,      special:minimized # mangowc: minimized
bind = Super, equal,          togglespecialworkspace, minimized        # mangowc: restore_minimized
bind = Ctrl+Super+Alt, up,    movetoworkspace,      special:special
bind = Ctrl+Super+Alt, down,  movetoworkspace,      e+0
bind = Super+Alt, S,          movetoworkspace,      special:special


# AUDIO & BRIGHTNESS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindel = , XF86AudioRaiseVolume,  exec, $ipc volume increase
bindel = , XF86AudioLowerVolume,  exec, $ipc volume decrease
bindl  = , XF86AudioMute,         exec, $ipc volume muteOutput
bindl  = , XF86AudioMicMute,      exec, $ipc volume muteInput
bindel = , XF86MonBrightnessUp,   exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease


# LAPTOP LID
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
bindl = , switch:Lid Switch,     exec, $ipc lockScreen lock
bindl = , switch:on:Lid Switch,  exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1"
