workspace = 10, monitor:HDMI-A-1, default:true, persistent:true
workspace = 11, monitor:HDMI-A-1, persistent:true
workspace = 12, monitor:HDMI-A-1, persistent:true
workspace = 13, monitor:HDMI-A-1, persistent:true
workspace = 14, monitor:HDMI-A-1, persistent:true
workspace = 15, monitor:HDMI-A-1, persistent:true
workspace = 16, monitor:HDMI-A-1, persistent:true
workspace = 17, monitor:HDMI-A-1, persistent:true
workspace = 18, monitor:HDMI-A-1, persistent:true

# Switch Workspaces (Super+1-9 now maps to workspaces 10-18)
bind = Super, 1, workspace, 10
bind = Super, 2, workspace, 11
bind = Super, 3, workspace, 12
bind = Super, 4, workspace, 13
bind = Super, 5, workspace, 14
bind = Super, 6, workspace, 15
bind = Super, 7, workspace, 16
bind = Super, 8, workspace, 17
bind = Super, 9, workspace, 18

# Move Window to Workspace
bind = Super+Shift, 1, movetoworkspace, 10
bind = Super+Shift, 2, movetoworkspace, 11
bind = Super+Shift, 3, movetoworkspace, 12
bind = Super+Shift, 4, movetoworkspace, 13
bind = Super+Shift, 5, movetoworkspace, 14
bind = Super+Shift, 6, movetoworkspace, 15
bind = Super+Shift, 7, movetoworkspace, 16
bind = Super+Shift, 8, movetoworkspace, 17
bind = Super+Shift, 9, movetoworkspace, 18
