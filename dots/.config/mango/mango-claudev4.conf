# ═══════════════════════════════════════════════════════════════════════════════
#  MangoWC — Comprehensive Configuration  (v3 — fully reconciled, Feb 2026)
#  Save to:  ~/.config/mango/config.conf
#  Template: cp /etc/mango/config.conf ~/.config/mango/config.conf
#
#  Sources:
#    • DreamMaoMao/mangowc wiki  (Feb 19 2026 — 188 revisions, 2.1k ★)
#    • bautitobal/mango           — Nord Detective dotfiles
#    • argosnothing/mango-dwm-config — DWM-migration defaults (12 ★)
#    • tonybanters/mangowc-btw    — tonybtw.com showcase (18 ★)
#    • tonybtw.com/tutorial/mangowc — written guide
#
#  ─── 10 TAG / VIEW STATES ───────────────────────────────────────────────────
#  Tag 1  → scroller      — Terminal / Dev        (infinite horizontal canvas)
#  Tag 2  → tile          — Code Editor           (master-stack, 60 % master)
#  Tag 3  → monocle       — Browser / Reading     (one maximised window)
#  Tag 4  → grid          — Chat / Communication  (equal-area tiles)
#  Tag 5  → deck          — Media / Video         (tabbed-deck, 70 % master)
#  Tag 6  → center_tile   — Documents / Writing   (centred master, side stacks)
#  Tag 7  → vertical_tile — System / Monitoring   (master top, stack bottom)
#  Tag 8  → vertical_grid — Design / Creative     (portrait-friendly grid)
#  Tag 9  → tgmix         — General / Gaming      (flexible mixed layout)
#  SUPER+0                — All-Tags view         (10th special view state)
#
#  ─── V3 CHANGELOG vs V2 ─────────────────────────────────────────────────────
#  Restored from v1 (were wrongly dropped in v2):
#    + bind SUPER+w             → waypaper (wallpaper manager)
#    + bind SUPER+CTRL+t        → alacritty (third terminal option)
#    + bind SUPER+p             → toggle_render_border (was SUPER+comma = collision)
#    + windowrule tags:6        → libreoffice.*, org.libreoffice.*
#    + windowrule tags:6        → zathura (short-form appid, distro compat)
#    + windowrule tags:9        → title:.*Steam.* (proper regex)
#    + windowrule globalkeybinding → OBS ctrl+alt-o (active, not commented)
#    + allow_shortcuts_inhibit=1   (explicit; was implicit default in v2)
#    + exec=  reload hook comment  (removed without reason in v2)
#
#  Kept from v2 (v1 errors that stay fixed):
#    ✓ Lock screen on SUPER+CTRL+l  (was SUPER+SHIFT+l = collision in v1)
#    ✓ tagrule mfact as floats 0.60 not integer 60
#    ✓ toggle_render_border on SUPER+p (was SUPER+comma = collision in v1)
#    ✓ No isterm/tag rules for TUI apps (btop, htop, nvim have no appid)
#    ✓ Hardware keys only in keymode=common (no duplication)
#    ✓ Floating move on Arrow keys only (SUPER+CTRL+Arrow, no hjkl conflict)
#    ✓ spawn_shell for all pipe/$() commands
#    ✓ No inline comments on bind/rule/exec/directive lines
#    ✓ circle_layout as comma-separated layout name string
#    ✓ switchbind syntax corrected per wiki
# ═══════════════════════════════════════════════════════════════════════════════


 ───────────────────────────────────────────────────────────────────────────────
# MONITOR RULES
# Discover output names with:  wlr-randr
# Format: monitorrule=name:<n>,width:<W>,height:<H>,refresh:<Hz>,x:<X>,y:<Y>
# ───────────────────────────────────────────────────────────────────────────────



# ───────────────────────────────────────────────────────────────────────────────
# APPEARANCE
# ───────────────────────────────────────────────────────────────────────────────

# Gaps in pixels: inner-horizontal, inner-vertical, outer-horizontal, outer-vertical
gappih=6
gappiv=6
gappoh=10
gappov=10

# Border
borderpx=3
border_radius=10
no_radius_when_single=0
no_border_when_single=0

# Cursor size (must match env=XCURSOR_SIZE above)
cursor_size=24

# Colors — Catppuccin Mocha palette
# Format: 0xRRGGBBaa  (last two hex digits = alpha channel; ff = fully opaque)
rootcolor=0x1e1e2eff
bordercolor=0x45475aff
focuscolor=0xcba6f7ff
urgentcolor=0xf38ba8ff
scratchpadcolor=0x89b4faff
globalcolor=0xa6e3a1ff
overlaycolor=0xf5c2e7ff
maximizescreencolor=0x94e2d5ff

# Window opacity (1.0 = fully opaque, 0.0 = fully transparent)
focused_opacity=1.0
unfocused_opacity=0.92

# Scratchpad popup size as a fraction of monitor dimensions (0.1–1.0)
scratchpad_width_ratio=0.80
scratchpad_height_ratio=0.85


