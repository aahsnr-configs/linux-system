# ───────────────────────────────────────────────────────────────────────────────
# MANGOWC TAG CONFIGURATION (10-Tag Productivity Setup)
#
# Supported Layouts: 
#   tile, scroller, monocle, grid, deck, center_tile, right_tile, 
#   vertical_tile, vertical_grid, vertical_scroller, vertical_spiral
# ───────────────────────────────────────────────────────────────────────────────

# --- TAG DEFINITIONS ---

# Tag 1: Terminal & CLI (Scroller for horizontal window stacking)
tagrule=id:1,layout_name:scroller

# Tag 2: Development (Classic tile with a wider master area for code)
tagrule=id:2,layout_name:scroller

# Tag 3: Primary Web (Monocle for distraction-free research)
tagrule=id:3,layout_name:scroller

# Tag 4: Communication (Grid for multi-chat visibility)
tagrule=id:4,layout_name:scroller

# Tag 5: File Management (Grid for easy drag-and-drop operations)
tagrule=id:5,layout_name:scroller

# Tag 6: Deep Writing & Office (Center-tile to focus text in the middle)
tagrule=id:6,layout_name:center_tile,mfact:0.70

# Tag 7: Reference & PDFs (Vertical Scroller for long document reading)
tagrule=id:7,layout_name:vertical_scroller

# Tag 8: Multimedia & Production (Deck to stack media players/mixers)
tagrule=id:8,layout_name:deck

# Tag 9: System Tools (Vertical Grid for hardware monitors/mixers)
tagrule=id:9,layout_name:vertical_grid


