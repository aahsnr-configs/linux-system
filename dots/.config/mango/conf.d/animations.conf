# ──────────────────────────────────────────────
# GNOME-like Window Animations
# ──────────────────────────────────────────────
animations=1
layer_animations=1
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1

# GNOME 49 uses zoom+fade (scale ~0.93→1.0 while fading in from transparent)
# Close uses fade with subtle scale-down — never zooms on close
animation_type_open=zoom
animation_type_close=fade
# Panels and bars slide in/out — matches GNOME notification/top-bar behavior
layer_animation_type_open=slide
layer_animation_type_close=slide

# GNOME timings: open at 250ms, close faster at 200ms (GNOME principle),
# move at 220ms, workspace/tag at 270ms, focus at 100ms
animation_duration_open=250
animation_duration_close=200
animation_duration_move=220
animation_duration_tag=270
animation_duration_focus=100

# --- CURVES ---
# Open: ease-out-expo (GNOME's dominant curve) + tiny 4% overshoot for the
# requested subtle spring feel. Rockets to size then barely overshoots.
# CSS equivalent: roughly cubic-bezier(0.16, 1.04, 0.30, 1.0)
animation_curve_open=0.16,1.04,0.30,1.0

# Move: ease-out-cubic with a 3% overshoot — window slides to position and
# settles with a whisper of spring. Not dramatic at all.
animation_curve_move=0.25,1.03,0.25,1.0

# Tag switch: ease-out slightly faster than open, 3% overshoot.
# Matches GNOME workspace slide character.
animation_curve_tag=0.22,1.03,0.28,1.0

# Close: PURE ease-out-expo, zero overshoot. GNOME never bounces on close.
# Fast start, soft landing, window is gone before your eye registers it.
animation_curve_close=0.07,0.90,0.15,1.0

# Focus: smooth ease-out, no overshoot. Opacity crossfades are never bouncy.
animation_curve_focus=0.46,1.00,0.29,1.0

# Fade-in: clean ease-out-expo for opacity — no overshoot on transparency.
# Opacity cannot meaningfully overshoot so we keep it pure.
animation_curve_opafadein=0.16,1.00,0.30,1.0

# Fade-out: near-linear, slightly eased. Quick, clean disappearance.
animation_curve_opafadeout=0.50,0.50,0.50,0.50

# GNOME-style zoom range: windows open from 93% of final size (nearly full),
# not 25%. This is what makes GNOME feel refined vs theatrical.
# The motion is almost imperceptible — you just feel the window "snap" into place.
zoom_initial_ratio=0.93
zoom_end_ratio=1.0

# GNOME fades windows in from fully transparent. The zoom+fade combo is what
# gives GNOME its polished, layered feel.
fadein_begin_opacity=0.0
# Close starts fully opaque and fades out fast — no lingering ghost windows.
fadeout_begin_opacity=1.0



# ──────────────────────────────────────────────
# macOS-like Window Animations
# ──────────────────────────────────────────────

# animations=1
# layer_animations=1
# animation_fade_in=1
# animation_fade_out=1
#
# # macOS Spaces switch is a horizontal slide — this is a defining macOS spatial characteristic
# tag_animation_direction=1
#
# # Open: zoom+fade — macOS scales windows from 90% while simultaneously fading from 0 opacity
# # This is the "materialization" effect: the window coalesces from near-nothing into place
# # Close: fade only — macOS close has NO scale-down, just a clean opacity fade to 0
# animation_type_open=zoom
# animation_type_close=fade
#
# # Panels, menu bar, notification center all slide in macOS — matches NSPanel behavior
# layer_animation_type_open=slide
# layer_animation_type_close=slide
#
# # --- DURATIONS ---
# # Open: 370ms — heavier and more deliberate than GNOME (250ms). This is the "weighty" premium
# # feel Apple deliberately builds in. Derived from Apple's spring(duration: 0.4, bounce: 0.15)
# # perceptual settling duration as used in macOS system window transitions.
# animation_duration_open=370
#
# # Close: 200ms — FAST. The sharp asymmetry between slow open and fast close is one of macOS's
# # most characteristic qualities. Windows vanish quickly; they don't linger.
# animation_duration_close=200
#
# # Move: 340ms — slightly shorter than open. Window drag-and-release has a spring feel
# # (like pushing a heavy object across a frictionless surface) but settles quicker.
# animation_duration_move=340
#
# # Tag/Spaces: 380ms — macOS Spaces switching is famously "mid-speed". Users frequently
# # note it feels "slightly slow" vs the rest of the OS. Apple intentionally makes it slower
# # to reinforce spatial metaphor — you're literally moving between "places".
# animation_duration_tag=380
#
# # Focus: 100ms — subtle and barely perceptible opacity crossfade on window focus change
# animation_duration_focus=100
#
# # --- BEZIER CURVES ---
# # Open: Approximation of CASpringAnimation(perceptualDuration: 0.4, bounce: 0.15)
# # x1=0.20: high initial velocity (window rockets to its target immediately)
# # y1=1.05: 5% overshoot (window briefly exceeds its final size before settling — the
# #          "bounce: 0.15" spring character — subtle but gives windows physical mass)
# # x2=0.30: deceleration begins at 30% of time elapsed
# # y2=1.0:  settles cleanly at the final position
# # This is the most faithful cubic-bezier representation of Apple's macOS spring for windows.
# animation_curve_open=0.20,1.05,0.30,1.0
#
# # Move: same spring character as open but slightly more aggressive initial velocity
# # for a more immediate-feeling response when windows are repositioned by the layout engine
# animation_curve_move=0.18,1.05,0.28,1.0
#
# # Tag/Spaces: PURE ease-out cubic — NO spring, NO overshoot
# # macOS Spaces are physical spaces. The slide is confident and never bounces.
# # This is a critical accuracy point: Spaces on macOS do NOT spring.
# animation_curve_tag=0.25,1.00,0.25,1.0
#
# # Close: fast ease-out, NO overshoot — window disappears with authority
# # Fast initial velocity (0.10) means the opacity collapses immediately and cleanly
# animation_curve_close=0.10,0.95,0.20,1.0
#
# # Focus: smooth gentle ease-out for the opacity crossfade — never springs
# animation_curve_focus=0.46,1.00,0.29,1.0
#
# # Fade-in opacity: ease-out expo character, no overshoot (opacity can't overshoot)
# animation_curve_opafadein=0.20,1.00,0.30,1.0
#
# # Fade-out: near-linear — quick, even opacity collapse on close
# animation_curve_opafadeout=0.50,0.50,0.50,0.50
#
# # --- ZOOM AND OPACITY RATIOS ---
# # The most macOS-specific parameter pair:
# # macOS windows open from 90% of their final size — barely noticeable, but creates the
# # sense that the window "materializes" from just below full size rather than "popping" in
# # Combined with the spring overshoot (y1=1.05 in the curve), the actual motion path is:
# # 90% → accelerates past 100% briefly to ~105% → settles at 100%
# # This is physically identical to Apple's own CASpringAnimation behavior on window open.
# zoom_initial_ratio=0.90
# zoom_end_ratio=1.0
#
# # Window opens from fully transparent — simultaneous with the scale zoom
# # This is accurate: macOS window open is always a zoom+fade-in combination
# fadein_begin_opacity=0.0
#
# # Window closes from fully opaque — immediately starts fading to nothing
# # No reduced-opacity start: the window is fully solid one frame, then begins disappearing
# fadeout_begin_opacity=1.0
