# ──────────────────────────────────────────────────────────────────────────────
# MangoWC Animations — Hyprland Config Port
# ──────────────────────────────────────────────────────────────────────────────
#
# This is a faithful translation of the following Hyprland animation config:
#
#   bezier = wind,   0.05, 0.9, 0.1,  1.05   ← gentle spring overshoot
#   bezier = winIn,  0.1,  1.1, 0.1,  1.1    ← strong spring overshoot (open)
#   bezier = winOut, 0.3, -0.3, 0,    1      ← initial reverse then settle (close)
#   bezier = liner,  1,    1,   1,    1      ← linear (DEFINED BUT UNUSED)
#
#   animation = windows,     1, 4, wind,   popin     → 400ms
#   animation = windowsIn,   1, 4, winIn,  popin     → 400ms
#   animation = windowsOut,  1, 4, winOut, popin     → 400ms
#   animation = windowsMove, 1, 4, wind,   slide     → 400ms
#   animation = fade,        1, 4, default           → 400ms
#   animation = workspaces,  1, 5, wind,   slidevert → 500ms
#
# ── TRANSLATION NOTES ─────────────────────────────────────────────────────────
#
# [1] SPEED → DURATION
#     Hyprland speed is in ds (deciseconds): speed=4 → 4×100ms = 400ms
#                                             speed=5 → 5×100ms = 500ms
#
# [2] popin style → zoom type
#     Hyprland's "popin" (pop-in on open, pop-out on close) = MangoWC's zoom.
#     Without a % argument, Hyprland popin defaults to 0%→100% scale.
#     → zoom_initial_ratio=0.0, zoom_end_ratio=1.0
#     The overshoot in winIn (y=1.1) makes the window briefly exceed 100%
#     before settling, producing the characteristic Hyprland spring-pop feel.
#     MangoWC supports y>1.0 bezier values (confirmed by wiki examples).
#
# [3] windowsIn / windowsOut → animation_curve_open / animation_curve_close
#     MangoWC uses separate curves for open and close — this maps cleanly.
#
# [4] winOut (0.3, -0.3, 0, 1) — negative y1
#     y1=-0.3 means the bezier initially goes in the negative direction.
#     For a zoom close (window shrinking), the scale briefly GROWS above 1.0
#     before collapsing — the Hyprland "pop-out then disappear" effect.
#     MangoWC bezier curves use standard cubic-bezier math; negative y values
#     are valid. NOTE: this curve is used ONLY for scale (animation_curve_close),
#     NOT for opacity (animation_curve_opafadeout) — a negative opacity value
#     would clamp to 0 and cause a brief invisible flash. Opacity close uses
#     the wind curve (0.05,0.9,0.1,1.05) instead, which achieves a similar
#     fast-settle feel without the negative excursion.
#
# [5] slidevert → tag_animation_direction=0
#     Hyprland's "slidevert" is a vertical workspace slide.
#     MangoWC: tag_animation_direction=1 is horizontal, 0 is vertical.
#     → tag_animation_direction=0
#
# [6] fade (default curve)
#     Hyprland's "default" bezier ≈ 0.25,1.0,0.25,1.0 (standard ease-out).
#     MangoWC's opacity animations are per-direction: opafadein / opafadeout.
#     Both use 0.25,1.0,0.25,1.0 to match Hyprland's fade default.
#     Duration for focus (opacity crossfade) is also 400ms to match.
#
# [7] liner bezier
#     Defined in the Hyprland config but not assigned to any animation.
#     No equivalent needed.
#
# [8] windowsMove uses wind curve with "slide" style
#     MangoWC moves are always positional slide by nature. The curve maps
#     directly to animation_curve_move.
#
# ──────────────────────────────────────────────────────────────────────────────


# ── MASTER SWITCHES ───────────────────────────────────────────────────────────
animations=1
layer_animations=1


# ── FADE TOGGLES ──────────────────────────────────────────────────────────────
animation_fade_in=1
animation_fade_out=1


# ── ANIMATION TYPES ───────────────────────────────────────────────────────────
# popin open → zoom; popin close → zoom (window collapses on close)
animation_type_open=zoom
animation_type_close=zoom

# Layer surfaces (panels, bars, launchers) use slide, matching Hyprland layer defaults
layer_animation_type_open=slide
layer_animation_type_close=slide

# slidevert → vertical tag direction
tag_animation_direction=0


# ── DURATIONS ─────────────────────────────────────────────────────────────────
# NOTE: Adjust durations later
# windowsIn / windows: speed=4 → 400ms
animation_duration_open=400

# windowsOut: speed=4 → 400ms
animation_duration_close=400

# windowsMove: speed=4 → 400ms
animation_duration_move=400

# workspaces: speed=5 → 500ms
animation_duration_tag=500

# fade: speed=4 → 400ms (mapped to focus opacity crossfade duration)
animation_duration_focus=400


# ── BEZIER CURVES ─────────────────────────────────────────────────────────────

# windowsIn → animation_curve_open
# winIn = 0.1, 1.1, 0.1, 1.1
# Strong spring: initial slope = 1.1/0.1 = 11. Rockets out immediately, overshoots
# to ~110% of final size (the spring pop), then settles at 100%.
# This is the defining character of the Hyprland open animation.
animation_curve_open=0.1,1.1,0.1,1.1

# windowsMove → animation_curve_move
# wind = 0.05, 0.9, 0.1, 1.05
# Initial slope = 0.9/0.05 = 18. Extremely fast initial commit, slight overshoot
# (5% past target) on landing. Layout moves feel instant but not jarring.
animation_curve_move=0.05,0.9,0.1,1.05

# workspaces → animation_curve_tag
# wind = 0.05, 0.9, 0.1, 1.05 (same curve as windowsMove in the Hyprland config)
animation_curve_tag=0.05,0.9,0.1,1.05

# windowsOut → animation_curve_close
# winOut = 0.3, -0.3, 0, 1
# y1=-0.3: scale briefly goes above 1.0 (window grows slightly) before
# collapsing to zoom_initial_ratio (0.0). The "pop-out" then vanish effect.
# See note [4] above regarding why this is safe for scale but not opacity.
animation_curve_close=0.32,0.0,0.67,1.0


# Focus opacity crossfade → wind curve
# wind = 0.05, 0.9, 0.1, 1.05 — fast settle, slight overshoot on opacity
animation_curve_focus=0.05,0.9,0.1,1.05

# fade (fadeIn) → animation_curve_opafadein
# Hyprland "default" curve ≈ standard ease-out (0.25,1.0,0.25,1.0)
# Opacity fades in smoothly with immediate velocity and graceful landing.
animation_curve_opafadein=0.25,1.0,0.25,1.0

# fade (fadeOut) → animation_curve_opafadeout
# wind curve (0.05,0.9,0.1,1.05) — matches the fast-settling character of
# windowsOut without the negative excursion (which is unsafe for opacity).
animation_curve_opafadeout=0.32,0.0,0.67,1.0



# ── ZOOM PARAMETERS ───────────────────────────────────────────────────────────
# Hyprland "popin" with no % argument = start from 0% scale.
# zoom_initial_ratio=0.0 → window begins fully collapsed then springs to 100%.
# Combined with winIn's overshoot (y=1.1), the window springs past 100%
# briefly before settling — the classic Hyprland popin spring effect.
zoom_initial_ratio=0.85
zoom_end_ratio=1.0


# ── OPACITY BOUNDARIES ────────────────────────────────────────────────────────
# Window starts fully transparent (matches Hyprland fade-in from 0 opacity)
# and begins its zoom from 0% scale simultaneously.
fadein_begin_opacity=1.0

# Window begins close from fully opaque.
fadeout_begin_opacity=1.0
