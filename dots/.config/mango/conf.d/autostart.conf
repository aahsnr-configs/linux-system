# ── autostart.conf ────────────────────────────────────────────────────────────
# Sourced at the very top of config.conf.
# exec-once = spawned once on compositor startup, NOT on config reload.
# exec       = spawned every time the config is reloaded (and on first startup).
# ─────────────────────────────────────────────────────────────────────────────

# DBus portal environment — must fire before any XDG portal consumer starts.
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots

# XDG desktop portal for wlroots (screencasting, file picker, etc.)
exec-once=/usr/libexec/xdg-desktop-portal-wlr

# Disable the built-in laptop display (eDP-1).
# mmsg disable_monitor races with compositor output registration at startup and
# is therefore unreliable. wlr-randr speaks the wlr-output-management protocol
# directly and is the correct tool, but it also needs the compositor to have
# fully enumerated its outputs first. sleep 2 provides that margin.
exec=bash -c "sleep 2 && wlr-randr --output eDP-1 --off"

# Clipboard — persist clipboard content across app exits, then index history.
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store

# Noctalia shell — restarted on every config reload.
# pkill terminates any running qs instance first; sleep gives it time to exit
# cleanly before the fresh instance starts.
exec-once=qs -c noctalia-shell --no-duplicate

exec=notify-send -u low -t 2000 "MangoWC" "Configuration reloaded"
exec=bash -c "pkill -x qs; sleep 0.5 && qs -c noctalia-shell --no-duplicate"

# Automount removable media
exec-once=udiskie

# Thunar file-manager daemon (fast cold opens + thumbnail generation)
exec-once=thunar --daemon

# ASUS ROG control centre (fan curves, AuraSync, etc.)
exec-once=rog-control-center

# Emacs server daemon
exec-once=emacs --daemon
