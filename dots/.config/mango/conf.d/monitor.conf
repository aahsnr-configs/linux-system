# External display — primary active display
# Logical width: 2560 / 1.25 = 2048
monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0

# Laptop panel — defined with corrected logical offset
# x:2048 ensures it starts where the HDMI display ends (avoids XWayland overlapping bugs)
#monitorrule=name:eDP-1,width:2560,height:1440,refresh:60,x:2048,y:0,scale:1,vrr:0,rr:0

# Headless virtual display (Sunshine/Moonlight streaming)
# monitorrule=name:HEADLESS-1,width:1920,height:1080,refresh:60,x:4608,y:0,scale:1,vrr:0,rr:0
