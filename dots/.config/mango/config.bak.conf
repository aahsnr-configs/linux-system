 ─────────────────────────────────────────────────────────────────────────────
# AUTOSTART — Programs launched once when MangoWC starts
# ─────────────────────────────────────────────────────────────────────────────

# Set wallpaper (replace with your image path)
exec-once=swaybg -i ~/.config/mango/wallpaper.png -m fill

# Status bar
exec-once=waybar -c ~/.config/mango/waybar/config.jsonc -s ~/.config/mango/waybar/style.css

# Notification daemon
exec-once=swaync

# Night light (3500K warm color temperature)
exec-once=wlsunset -T 3500 -t 3000

# Clipboard history manager
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store

# Permission authentication agent
exec-once=/usr/lib/xfce-polkit/xfce-polkit

# Idle inhibitor (stops sleep during media playback)
exec-once=sway-audio-idle-inhibit

# XDG portal for screen sharing / file picking
exec-once=/usr/lib/xdg-desktop-portal-wlr

# Keyring
exec-once=gnome-keyring-daemon --start --components=secrets

# Auto-lock after 10 minutes of idle
exec-once=swayidle -w \
    timeout 600 'swaylock -f' \
    timeout 900 'wlr-dpms off' \
    resume 'wlr-dpms on' \
    before-sleep 'swaylock -f'

# ─────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────────────────────

# Wayland backend for toolkits
env=GDK_BACKEND,wayland
env=QT_QPA_PLATFORM,wayland;xcb
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland

# XWayland DPI
env=GDK_SCALE,1

# Qt styling
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_AUTO_SCREEN_SCALE_FACTOR,1

# Cursor
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,24

# Input method (fcitx5 — remove if not needed)
# env=GTK_IM_MODULE,fcitx
# env=QT_IM_MODULE,fcitx
# env=XMODIFIERS,@im=fcitx

# XWayland identification
env=XDG_CURRENT_DESKTOP,wlroots
env=XDG_SESSION_TYPE,wayland

# ─────────────────────────────────────────────────────────────────────────────
# MONITOR CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
# Format: monitorrule=NAME,mfact,nmaster,layout,show_bar,vrr,x,y,width,height,hz,scale
#
# Fallback rule — works on any display. Adjust NAME to match your output
# (use `wlr-randr` or `mmsg -O` to find your monitor name).

# Primary monitor: 1920×1080 @ 144 Hz, positioned at 0,0
monitorrule=eDP-1,0.55,1,tile,1,1,0,0,1920,1080,144,1

# Example for a secondary HDMI monitor to the right
# monitorrule=HDMI-A-1,0.55,1,tile,1,1,1920,0,1920,1080,60,1

# Wildcard fallback (matches any unconfigured monitor)
monitorrule=*,0.55,1,tile,1,0,0,0,1920,1080,60,1

# ─────────────────────────────────────────────────────────────────────────────
# TAG RULES — Per-tag layouts (10 tags)
# ─────────────────────────────────────────────────────────────────────────────
# Format: tagrule=id:N,layout_name:LAYOUT[,option:value,...]
#
# Available layouts:
#   tile            — Classic master-stack (default DWM-style)
#   scroller        — Horizontal scrolling columns (like PaperWM)
#   center_tile     — Master centered with stacks on both sides
#   grid            — Windows arranged in a grid
#   monocle         — One window fills the screen (tabbed view)
#   deck            — Master + tabbed stack on the right
#   vertical_tile   — Vertical master-stack
#   vertical_grid   — Vertical grid arrangement
#   vertical_scroller — Vertical scrolling rows

# ── Tag 1: Terminal Workspace ──────────────────────────────────────────────
# Classic master-stack. Master on left, terminals stack on right.
# Great for a primary terminal + secondary panes (htop, logs, etc.)
tagrule=id:1,layout_name:tile

# ── Tag 2: General / Work ──────────────────────────────────────────────────
# Also tile, but with 2 master windows for side-by-side editing.
tagrule=id:2,layout_name:tile

# ── Tag 3: Browser / Web ──────────────────────────────────────────────────
# Scroller: each browser window gets its own column you can slide through.
# Ideal for keeping multiple browser instances or tabs tiled separately.
tagrule=id:3,layout_name:scroller

# ── Tag 4: Research / Reading ─────────────────────────────────────────────
# Scroller with a wider default proportion so long pages have room to breathe.
tagrule=id:4,layout_name:scroller

# ── Tag 5: Coding / IDE ───────────────────────────────────────────────────
# Center-tile: your editor sits prominently in the center; helper windows
# (terminal, file tree, documentation) flank it on both sides.
tagrule=id:5,layout_name:center_tile

# ── Tag 6: Media / Gallery ────────────────────────────────────────────────
# Grid: perfect for watching multiple streams, monitoring dashboards, or
# displaying a gallery of images side-by-side.
tagrule=id:6,layout_name:grid

# ── Tag 7: System Monitoring ──────────────────────────────────────────────
# Grid again — excellent for htop, nvtop, btop, and logs all at once.
tagrule=id:7,layout_name:grid

# ── Tag 8: Focus / Presentation ───────────────────────────────────────────
# Monocle: one window fills the entire screen. Cycle through with focusstack.
# Great for writing, reading, or presenting without distractions.
tagrule=id:8,layout_name:monocle

# ── Tag 9: Chat / Communication ───────────────────────────────────────────
# Deck: one chat app is master (e.g. Signal), others stack as a tabbed list
# on the right — quickly switch between Discord, Slack, email, etc.
tagrule=id:9,layout_name:deck

# ── Tag 10: Notes / Documentation ─────────────────────────────────────────
# Vertical scroller: documents and notes scroll vertically, giving each
# its own row. Good for Obsidian, Zathura PDFs, and man pages stacked tall.
tagrule=id:10,layout_name:vertical_scroller

# ─────────────────────────────────────────────────────────────────────────────
# APPEARANCE
# ─────────────────────────────────────────────────────────────────────────────
gappi=6
gappo=10
border_width=2
border_color_focused=0xff9963c9
border_color_unfocused=0xff45475a
no_border_when_single=1
border_radius=10
no_radius_when_single=1

# ─────────────────────────────────────────────────────────────────────────────
# VISUAL EFFECTS (scenefx)
# ─────────────────────────────────────────────────────────────────────────────

# Blur (disable on low-end GPU — comment these out if you get lag)
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.92
blur_params_contrast=0.88
blur_params_saturation=1.2

# Shadows
shadows=1
shadow_only_floating=0
layer_shadows=0
shadows_size=12
shadows_blur=18
shadows_position_x=2
shadows_position_y=4
shadowscolor=0x55000000

# Window opacity
# Focused windows are fully opaque; unfocused windows are slightly transparent
focused_opacity=1.0
unfocused_opacity=0.88

# ─────────────────────────────────────────────────────────────────────────────
# ANIMATIONS
# ─────────────────────────────────────────────────────────────────────────────

animations=1
layer_animations=1

# Window open animation: zoom in from a small size (feels snappy and modern)
animation_type_open=zoom
animation_type_close=fade

# Layer (waybar, notifications) animations
layer_animation_type_open=slide
layer_animation_type_close=slide

# Fade effects on open/close
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=0.9

# Tag switch slides horizontally (1=horizontal, 0=vertical)
tag_animation_direction=1

# Zoom parameters
zoom_initial_ratio=0.85
zoom_end_ratio=1.0

# Durations (ms) — keep open/close snappy, move smooth
animation_duration_open=220
animation_duration_close=180
animation_duration_move=300
animation_duration_tag=280
animation_duration_focus=150

# Bezier curves (cubic-bezier: x1,y1,x2,y2)
# Ease-out spring for open/move/tag — feels natural and fluid
animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_move=0.25,1.0,0.3,1.0
animation_curve_tag=0.25,1.0,0.25,1.0
# Ease-in for close — quick dismissal
animation_curve_close=0.4,0.0,1.0,1.0
animation_curve_focus=0.46,1.0,0.29,1.0
animation_curve_opafadein=0.46,1.0,0.29,1.0
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# ────────────────────────────────────────────────────
# LAYOUT FINE-TUNING
# ────────────────────────────────────────────────────

# ── Master-Stack (tile / Tags 1 & 2)
default_mfact=0.55          # Master area takes 55% of screen width
default_nmaster=1           # 1 master window by default
new_is_master=1             # New window spawns as master
smartgaps=1                 # Remove gaps when only one window is visible
center_master_overspread=0  # center_tile: master does NOT spread when alone
center_when_single_stack=1  # center_tile: center master when only 1 stack

# ── Scroller (Tags 3 & 4)
scroller_structs=20                     # Reserved px on sides at proportion=1.0
scroller_default_proportion=0.75        # Each column takes 75% of screen by default
scroller_focus_center=1                 # Always scroll focused window to center
scroller_prefer_center=0
scroller_prefer_overspread=1            # Fill empty space automatically
edge_scroller_pointer_focus=1           # Focus partially-visible windows by pointer
scroller_ignore_proportion_single=1     # Don't auto-adjust single-window tags
scroller_default_proportion_single=1.0  # Single window fills the screen
scroller_proportion_preset=0.5,0.67,0.75,1.0  # Cycle presets with Alt+X

# ──────────────────────────────────────────────────
# OVERVIEW (Exposé / Hycov-style)
# ──────────────────────────────────────────────────

enable_hotarea=1    # Move cursor to corner to trigger overview
hotarea_size=12     # 12×12 px hot corner
hotarea_corner=2    # 2 = bottom-left corner
ov_tab_mode=0       # Disable tab mode (use explicit toggle instead)
overviewgappi=8     # Inner gap between windows in overview
overviewgappo=32    # Outer gap from screen edge in overview

# ──────────────────────────────────────────────────
# MISCELLANEOUS BEHAVIOR
# ──────────────────────────────────────────────────

xwayland_persistence=1      # Keep XWayland running to speed up X11 app launches
sloppyfocus=1               # Focus follows mouse movement
warpcursor=1                # Warp cursor to newly focused window
focus_on_activate=1         # Focus window when it requests activation
view_current_to_back=1      # Re-pressing current tag jumps back to previous tag
enable_floating_snap=1      # Snap floating windows to edges/other windows
snap_distance=24            # Snap trigger distance in pixels
drag_corner=4               # Drag resize from nearest corner (4=closest)
drag_warp_cursor=1          # Warp cursor to resize corner when dragging
drag_tile_to_tile=1         # Tiled windows retile on drag-and-drop between slots
single_scratchpad=1         # Only one named scratchpad visible at a time
allow_tearing=0             # Disable tearing (enable = 1 for gaming)
cursor_hide_timeout=5       # Hide cursor after 5 seconds of inactivity
circle_layout=tile,scroller,center_tile,grid,monocle  # Layout cycle order

# ──────────────────────────────────────────────────
# INPUT DEVICES
# ──────────────────────────────────────────────────

# Keyboard
repeat_rate=30        # Key repeat rate (chars/sec)
repeat_delay=250      # Delay before repeating starts (ms)
numlockon=1           # Numlock on at startup

# Trackpad / Touchpad
tap_to_click=1              # Tap to click
tap_and_drag=1              # Tap and drag
drag_lock=1                 # Lift finger then continue dragging
trackpad_natural_scrolling=1 # Reverse (natural) scroll direction
disable_while_typing=1      # Disable trackpad while typing
scroll_method=1             # Two-finger scrolling
click_method=2              # Clickfinger: 1 finger=left, 2=right, 3=middle
send_events_mode=2          # Disable trackpad when external mouse is connected
accel_profile=2             # Adaptive acceleration
accel_speed=0.1             # Slight speed boost

# Mouse
mouse_natural_scrolling=0   # Standard mouse scroll direction (NOT reversed)
left_handed=0               # Right-handed mode

# Cursor theme and size
cursor_theme=Bibata-Modern-Classic
cursor_size=24

