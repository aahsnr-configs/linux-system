# ── Size rules for specific apps ─────────────────────────────────────────

# Floating terminals for quick tasks (named scratchpads — see Scratchpad section)
windowrule=width:900,height:550,title:^scratchterm$
windowrule=floating:1,title:^scratchterm$

# MPV — open in a reasonable floating size (optional, remove to tile it)
# windowrule=width:960,height:540,appid:mpv
# windowrule=floating:1,appid:mpv

# ─────────────────────────────────────────────────────────────────────────────
# LAYER RULES (for bars, notifications, overlays)
# ─────────────────────────────────────────────────────────────────────────────

# Prevent notification layer from receiving animation/blur artifacts during screenshot
layerrule=noanim:1,noblur:1,layer_name:selection

# Blur the waybar/notification layers
layerrule=blur:1,layer_name:waybar
layerrule=blur:1,layer_name:notifications
layerrule=blur:1,layer_name:swaync

# Give notifications smooth animations
layerrule=anim_type_open:slide,layer_name:swaync
layerrule=anim_type_close:slide,layer_name:swaync

# ─────────────────────────────────────────────────────────────────────────────
# SCRATCHPADS
# ─────────────────────────────────────────────────────────────────────────────

# Sway-style scratchpad (Super+I sends to scratchpad, Alt+Z toggles visibility)
# Already bound below in key bindings.

# Named Scratchpads (toggle by title/appid — app can be pre-launched or not)
# A floating terminal: launch with `foot -T scratchterm`
# bind=ALT,grave,named_scratchpad,scratchterm,foot -T scratchterm
# (configured in keybinds below)

# ─────────────────────────────────────────────────────────────────────────────
# KEY BINDINGS
# ─────────────────────────────────────────────────────────────────────────────
# Format: bind=[FLAGS,]MODIFIERS,KEY,COMMAND[,ARGS]
# Flags: r=repeat, e=on-release, l=locked (works on lockscreen), n=non-consuming

# ── Config management ─────────────────────────────────────────────────────
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,m,quit

# ── Applications ──────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,rofi -show drun -show-icons
bind=SUPER+SHIFT,d,spawn,rofi -show run
bind=SUPER,e,spawn,thunar
bind=SUPER,b,spawn,firefox
bind=SUPER+SHIFT,e,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Screenshot — area selection (requires grim + slurp + satty)
bind=CTRL+ALT,a,spawn_shell,grim -g "$(slurp)" -t ppm - | satty -f -
# Full screenshot
bind=CTRL+ALT,s,spawn_shell,grim -t png ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

# Color picker
bind=SUPER+SHIFT,c,spawn,hyprpicker -a

# Power menu
bind=SUPER+SHIFT,q,spawn,wlogout

# Lock screen
bind=SUPER,l,spawn,swaylock -f

# Notification control (swaync)
bind=SUPER,n,spawn,swaync-client -t     # Toggle notification center
bind=SUPER+SHIFT,n,spawn,swaync-client -d  # Dismiss all

# Volume (requires pamixer / swayosd)
bind=none,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bind=none,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bind=none,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle

# Brightness (requires brightnessctl / swayosd)
bind=none,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=none,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

# Media playback
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86AudioPrev,spawn,playerctl previous

# ── Window actions ────────────────────────────────────────────────────────
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,Space,togglefloating
bind=SUPER,g,toggleglobal           # Sticky: appears on all tags
bind=SUPER,o,toggleoverlay          # Always on top
bind=SUPER,i,minimized              # Send to scratchpad (sway-style)
bind=SUPER+SHIFT,i,restore_minimized

# Maximize to current monitor (fills screen without fullscreen mode)
bind=ALT,a,togglemaximizescreen

# ── Focus navigation ─────────────────────────────────────────────────────
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# ── Window swapping ───────────────────────────────────────────────────────
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Promote focused window to master
bind=SUPER,Return,zoom

# ── Resize (tiling) ───────────────────────────────────────────────────────
bind=r,CTRL+SUPER,h,resizeclient,-30,0
bind=r,CTRL+SUPER,l,resizeclient,30,0
bind=r,CTRL+SUPER,k,resizeclient,0,-30
bind=r,CTRL+SUPER,j,resizeclient,0,30
bind=r,CTRL+SUPER,Left,resizeclient,-30,0
bind=r,CTRL+SUPER,Right,resizeclient,30,0
bind=r,CTRL+SUPER,Up,resizeclient,0,-30
bind=r,CTRL+SUPER,Down,resizeclient,0,30

# Adjust master factor (width of master area)
bind=r,SUPER+ALT,h,setmfact,-0.02
bind=r,SUPER+ALT,l,setmfact,0.02
bind=r,SUPER+ALT,Left,setmfact,-0.02
bind=r,SUPER+ALT,Right,setmfact,0.02

# Number of masters
bind=SUPER+ALT,Up,incnmaster,1
bind=SUPER+ALT,Down,incnmaster,-1

# ── Move floating windows ─────────────────────────────────────────────────
bind=r,SUPER+CTRL+SHIFT,Left,moveclient,-30,0
bind=r,SUPER+CTRL+SHIFT,Right,moveclient,30,0
bind=r,SUPER+CTRL+SHIFT,Up,moveclient,0,-30
bind=r,SUPER+CTRL+SHIFT,Down,moveclient,0,30

# ── Gap control ───────────────────────────────────────────────────────────
bind=ALT+SHIFT,r,togglegap          # Toggle gaps on/off
bind=SUPER+ALT,equal,incgappi,2     # Increase inner gap
bind=SUPER+ALT,minus,incgappi,-2    # Decrease inner gap

# ── Layout cycling ────────────────────────────────────────────────────────
bind=SUPER,t,switch_layout,next     # Cycle through layouts in circle_layout
bind=SUPER+SHIFT,t,switch_layout,prev

# Manually set specific layouts for current tag
bind=SUPER+CTRL,1,setlayout,tile
bind=SUPER+CTRL,2,setlayout,scroller
bind=SUPER+CTRL,3,setlayout,center_tile
bind=SUPER+CTRL,4,setlayout,grid
bind=SUPER+CTRL,5,setlayout,monocle
bind=SUPER+CTRL,6,setlayout,deck
bind=SUPER+CTRL,7,setlayout,vertical_scroller
bind=SUPER+CTRL,8,setlayout,vertical_grid

# ── Scroller-specific ────────────────────────────────────────────────────
bind=ALT,e,resetproportion          # Reset scroller proportion to default
bind=ALT,x,switchproportion         # Cycle through scroller_proportion_preset
# Scroll through columns in scroller layout
bind=r,SUPER,bracketleft,scroll_in_scroller,left
bind=r,SUPER,bracketright,scroll_in_scroller,right

# ── Overview (Exposé) ─────────────────────────────────────────────────────
bind=ALT,Tab,toggleoverview

# ── Scratchpad ────────────────────────────────────────────────────────────
bind=ALT,z,toggle_scratchpad        # Toggle scratchpad (sway-style)

# Named scratchpad: floating terminal (launch foot with -T scratchterm)
bind=ALT,grave,named_scratchpad,scratchterm,foot -T scratchterm

# ── Tags / Workspaces ─────────────────────────────────────────────────────
# Switch to tag N
bind=SUPER,1,viewtag,1
bind=SUPER,2,viewtag,2
bind=SUPER,3,viewtag,3
bind=SUPER,4,viewtag,4
bind=SUPER,5,viewtag,5
bind=SUPER,6,viewtag,6
bind=SUPER,7,viewtag,7
bind=SUPER,8,viewtag,8
bind=SUPER,9,viewtag,9
bind=SUPER,0,viewtag,10

# Move focused window to tag N (and follow it)
bind=SUPER+SHIFT,1,tag_client,1
bind=SUPER+SHIFT,2,tag_client,2
bind=SUPER+SHIFT,3,tag_client,3
bind=SUPER+SHIFT,4,tag_client,4
bind=SUPER+SHIFT,5,tag_client,5
bind=SUPER+SHIFT,6,tag_client,6
bind=SUPER+SHIFT,7,tag_client,7
bind=SUPER+SHIFT,8,tag_client,8
bind=SUPER+SHIFT,9,tag_client,9
bind=SUPER+SHIFT,0,tag_client,10

# Move focused window to tag N (don't follow)
bind=SUPER+CTRL,1,only_tag_client,1
bind=SUPER+CTRL,2,only_tag_client,2
bind=SUPER+CTRL,3,only_tag_client,3
bind=SUPER+CTRL,4,only_tag_client,4
bind=SUPER+CTRL,5,only_tag_client,5
bind=SUPER+CTRL,6,only_tag_client,6
bind=SUPER+CTRL,7,only_tag_client,7
bind=SUPER+CTRL,8,only_tag_client,8
bind=SUPER+CTRL,9,only_tag_client,9
bind=SUPER+CTRL,0,only_tag_client,10

# Navigate tags sequentially
bind=SUPER,comma,viewtag,prev
bind=SUPER,period,viewtag,next

# ── Multi-monitor ─────────────────────────────────────────────────────────
# Focus other monitor
bind=ALT+SHIFT,Left,focusmon,prev
bind=ALT+SHIFT,Right,focusmon,next

# Move window to other monitor
bind=SUPER+ALT,Left,tagmon,prev
bind=SUPER+ALT,Right,tagmon,next

# ─────────────────────────────────────────────────────────────────────────────
# MOUSE BINDINGS
# ─────────────────────────────────────────────────────────────────────────────

# Super + Left Click: move floating window
mousebind=SUPER,BTN_LEFT,moveclient

# Super + Right Click: resize window (from nearest corner)
mousebind=SUPER,BTN_RIGHT,resizeclient

# Overview: left-click to focus, right-click to close
# (These are handled automatically when in overview mode)

# ─────────────────────────────────────────────────────────────────────────────
# AXIS BINDINGS (scroll wheel)
# ─────────────────────────────────────────────────────────────────────────────

axis_bind_apply_timeout=100     # ms between scroll ticks to count as consecutive
axis_scroll_factor=1.0

# Super + scroll: switch tags
axisbind=SUPER,WL_AXIS_SCROLL_DOWN,viewtag,next
axisbind=SUPER,WL_AXIS_SCROLL_UP,viewtag,prev

# ─────────────────────────────────────────────────────────────────────────────
# GESTURE BINDINGS (touchpad swipes)
# ─────────────────────────────────────────────────────────────────────────────

# 3-finger swipe left/right: switch tags
gesturebind=3,right,viewtag,prev
gesturebind=3,left,viewtag,next

# 4-finger swipe up/down: toggle overview / minimize
gesturebind=4,up,toggleoverview
gesturebind=4,down,minimized

# ─────────────────────────────────────────────────────────────────────────────
# KEYBOARD LAYOUT / IME
# ─────────────────────────────────────────────────────────────────────────────

# XKB keyboard layout (change to match yours, e.g. "gb" or "de")
xkb_layout=us
# xkb_variant=
# xkb_options=grp:alt_shift_toggle   # Uncomment for layout switching

# ─────────────────────────────────────────────────────────────────────────────
# END OF CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
# Quick Reference — Tag Layouts:
#
#   Super + 1   Terminal workspace    [ tile         ] master-stack
#   Super + 2   General work         [ tile         ] master-stack (2 masters)
#   Super + 3   Browser              [ scroller     ] horizontal scroll
#   Super + 4   Research / Reading   [ scroller     ] horizontal scroll
#   Super + 5   Coding / IDE         [ center_tile  ] centered master
#   Super + 6   Media                [ grid         ] grid tiles
#   Super + 7   Monitoring           [ grid         ] grid tiles
#   Super + 8   Focus / Writing      [ monocle      ] single fullscreen
#   Super + 9   Communication        [ deck         ] master + tabbed stack
#   Super + 0   Notes / Docs         [ vertical_scroller ] vertical rows
#
# Useful IPC commands:
#   mmsg -g -c              Get focused window's appid/title
#   mmsg -g                 Get all compositor state
#   mmsg -d reload_config   Reload config from outside mango
#   wlr-randr               List monitor names
