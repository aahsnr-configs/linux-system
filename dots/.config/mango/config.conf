# ════════════════════════════════════════════════════════════
# Mango Window Manager - Tokyo Night Config
# ════════════════════════════════════════════════════════════

# More option see https://github.com/DreamMaoMao/mango/wiki/


# ────────────────────────────────────────────────────────────
# Autostart
# ────────────────────────────────────────────────────────────
# exec-once=waybar
# exec-once=swaybg -i ~/.config/mango/wallpaper/room.png
# exec-once=vicinae server
exec-once=qs -c noctalia-shell

# ────────────────────────────────────────────────────────────
# Monitor
# ────────────────────────────────────────────────────────────
monitorrule=name:HDMI-A-1,width:2560,height:1440,refresh:60,x:0,y:0,vrr:0,scale:2.0

# ────────────────────────────────────────────────────────────
# Visual Effects
# ────────────────────────────────────────────────────────────
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=4
blur_params_radius=22
blur_params_noise=0.003
blur_params_brightness=0.94
blur_params_contrast=1.05
blur_params_saturation=1.1
shadows=1
shadow_only_floating=0
shadows_size=18
shadows_blur=28
shadowscolor=0x00000066
border_radius=12
focused_opacity=0.92
unfocused_opacity=0.78


# ────────────────────────────────────────────────────────────
# Animations - macOS Tahoe Style (Smooth, elegant, natural)
# ────────────────────────────────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.96
zoom_end_ratio=1.0
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0
animation_duration_move=360
animation_duration_open=420
animation_duration_tag=360
animation_duration_close=280
animation_duration_focus=240
animation_curve_open=0.25,0.1,0.25,1.0
animation_curve_move=0.4,0.0,0.2,1.0
animation_curve_tag=0.4,0.0,0.2,1.0
animation_curve_close=0.25,0.1,0.25,1.0
animation_curve_focus=0.25,0.1,0.25,1.0



# ────────────────────────────────────────────────────────────
# Layouts
# ────────────────────────────────────────────────────────────

# Scroller
# ────────────────────────────────────────────────────────────
scroller_structs=6
scroller_default_proportion=0.33
scroller_focus_center=1
scroller_default_proportion_single=0.33
scroller_proportion_preset=0.33,0.77,1.0

# Master
# ────────────────────────────────────────────────────────────
new_is_master=1
default_mfact=0.50
smartgaps=0


# ────────────────────────────────────────────────────────────
# Overview
# ────────────────────────────────────────────────────────────
enable_hotarea=1
hotarea_size=10
overviewgappi=10
overviewgappo=40


# ────────────────────────────────────────────────────────────
# Misc
# ────────────────────────────────────────────────────────────
sloppyfocus=1
warpcursor=0
focus_cross_monitor=1
enable_floating_snap=1
focus_on_activate=1
cursor_size=32
xwayland_persistence=1
allow_tearing=0
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
adaptive_sync=1


# ────────────────────────────────────────────────────────────
# Input
# ────────────────────────────────────────────────────────────
repeat_rate=25
repeat_delay=800
numlockon=1
xkb_rules_layout=us
xkb_rules_options=caps:ctrl
mouse_natural_scrolling=0


# ────────────────────────────────────────────────────────────
# Appearance
# ────────────────────────────────────────────────────────────
gappih=10
gappiv=10
gappoh=10
gappov=10
borderpx=2
rootcolor=0x1a1b26ff
bordercolor=0x7aa2f7ff
focuscolor=0x7dcfffff
urgentcolor=0xf7768eff


# ────────────────────────────────────────────────────────────
# Tag Rules
# ────────────────────────────────────────────────────────────
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:0,layout_name:scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:grid
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:vertical_scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller


# ────────────────────────────────────────────────────────────
# Window Rules
# ────────────────────────────────────────────────────────────
# Disable blur for selection tools
windowrule=noblur:1,appid:slurp

# Terminal swallowing setup
windowrule=isterm:1,appid:kitty

# TODO
# Qt and GTK managers
windowrule=isfloating:1,center:1,width:800,height:600,appid:qt5ct
windowrule=isfloating:1,center:1,width:800,height:600,appid:qt5ct
windowrule=isfloating:1,center:1,width:800,height:600,appid:lxappearance
# TODO
# Bitwarden popup
windowrule=isfloating:1,noopenmaximized:1,noblur:1,width:600,height:600,appid:brave-browser,title:Bitwarden

# Save / Open dialogs
windowrule=isfloating:1,noopenmaximized:1,appid:brave-browser,title:^(Save|Open|Export)
windowrule=isfloating:1,noopenmaximized:1,title:^(Open File|Save File|Preferences|Properties|About)

# Picture-in-Picture
windowrule=isfloating:1,isnoshadow:1,ignore_maximize:1,ignore_minimize:1,width:480,height:270,appid:brave-browser,title:Picture-in-Picture

# Essential Keybinds
bind=SUPER,q,killclient
bind=SUPER,m,quit
bind=SUPER,Return,spawn,foot
bind=SUPER,r,reload_config


# Application Launchers 
# ──────────────────────────────────────────────────────────────
bind=SUPER,Return,spawn,kitty
bind=SUPER,D,spawn,qs -c noctalia-shell ipc call launcher toggle


# Noctalia Shell
# ──────────────────────────────────────────────────────────────
bind=SUPER,V,spawn,qs -c noctalia-shell ipc call launcher clipboard
bind=SUPER,M,spawn,qs -c noctalia-shell ipc call systemMonitor toggle
bind=SUPER,Comma,spawn,qs -c noctalia-shell ipc call settings toggle
bind=SUPER,X,spawn,qs -c noctalia-shell ipc call sessionMenu toggle
bind=SUPER+ALT,L,spawn,qs -c noctalia-shell ipc call sessionMenu lockAndSuspend


# Media Controls
# ──────────────────────────────────────────────────────────────
bind=NONE,XF86AudioRaiseVolume,spawn,qs -c noctalia-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,qs -c noctalia-shell ipc call volume decrease
bind=NONE,XF86MonBrightnessUp,spawn,qs -c noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,qs -c noctalia-shell ipc call brightness decrease



# Switch Focus
# ──────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down


# Switch Focus
# ──────────────────────────────────────────────────────────────
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down


# Window States
# ──────────────────────────────────────────────────────────────
bind=SUPER,F,togglefullscreen
bind=SUPER,A,togglemaximizescreen
bind=SUPER,Space,togglefloating
bind=SUPER,Tab,toggleoverview
bind=SUPER,O,toggleoverlay
bind=SUPER,G,toggleglobal
bind=SUPER,I,minimized
bind=SUPER+SHIFT,I,restore_minimized


# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=Alt,btn_left,moveresize,curmove
mousebind=Alt,btn_middle,togglemaxmizescreen,0
mousebind=Alt,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,-1
mousebind=NONE,btn_right,killclient,0
