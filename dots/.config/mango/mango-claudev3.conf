button_map=0

drag_corner=4
drag_warp_cursor=1
drag_tile_to_tile=1
enable_floating_snap=1
snap_distance=20


# ───────────────────────────────────────────────────────────────────────────────
# MISCELLANEOUS BEHAVIOUR
# ───────────────────────────────────────────────────────────────────────────────

