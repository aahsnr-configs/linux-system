# ───────────────────────────────────────────────────────────────────────────────
# LAYER RULES
# Discover layer names with:  mmsg -e  (while the layer surface is open)
# Format: layerrule=Param:Value,...,layer_name:<regex>
# ───────────────────────────────────────────────────────────────────────────────

# Screenshot area-selector — disable blur/animation to prevent artefacts
layerrule=noanim:1,noblur:1,layer_name:selection

# Waybar — slide in from screen edge
layerrule=animation_type_open:slide,animation_type_close:slide,layer_name:waybar

# swaync notification popup — zoom in, fade out
layerrule=animation_type_open:zoom,animation_type_close:fade,layer_name:swaync-notification-window

# swaync control-centre panel — slide in/out
layerrule=animation_type_open:slide,animation_type_close:slide,layer_name:swaync-control-center

# Rofi / any launcher — zoom in and out
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi

# swaylock — no animation, no blur leaking behind the lock screen
layerrule=noanim:1,noblur:1,layer_name:swaylock


# ───────────────────────────────────────────────────────────────────────────────
# WINDOW RULES
# Both appid and title fields support PCRE2 regex.
# Discover appid / title with:  mmsg -e  (while hovering the window)
#
# Format:
#   windowrule=Param:Value,...,appid:<regex>
#   windowrule=Param:Value,...,title:<regex>
#   windowrule=Param:Value,...,appid:<regex>,title:<regex>
#
# IMPORTANT — TUI applications (btop, htop, nvim, etc.) run inside a terminal
# emulator and inherit its appid, NOT their own. Tag assignments for them
# will never match. Launch TUI apps inside a terminal on Tag 1 instead.
# ───────────────────────────────────────────────────────────────────────────────

# ── Terminal swallow (isterm) ────────────────────────────────────────────────
# A GUI window spawned from an isterm terminal temporarily replaces it until
# the GUI window closes ("window swallowing").
windowrule=isterm:1,appid:kitty
windowrule=isterm:1,appid:foot
windowrule=isterm:1,appid:Alacritty
windowrule=isterm:1,appid:org.wezfurlong.wezterm

# ── Tag 1 — Terminals ────────────────────────────────────────────────────────
windowrule=tags:1,appid:kitty
windowrule=tags:1,appid:foot
windowrule=tags:1,appid:Alacritty
windowrule=tags:1,appid:org.wezfurlong.wezterm

# ── Tag 2 — Code editors and IDEs ────────────────────────────────────────────
windowrule=tags:2,appid:code
windowrule=tags:2,appid:Code
windowrule=tags:2,appid:neovide
windowrule=tags:2,appid:jetbrains-idea
windowrule=tags:2,appid:jetbrains-pycharm

# ── Tag 3 — Web browsers ─────────────────────────────────────────────────────
windowrule=tags:3,appid:firefox
windowrule=tags:3,appid:brave-browser
windowrule=tags:3,appid:chromium
windowrule=tags:3,appid:org.gnome.Epiphany

# ── Tag 4 — Chat and communication ───────────────────────────────────────────
windowrule=tags:4,appid:discord
windowrule=tags:4,appid:vesktop
windowrule=tags:4,appid:slack
windowrule=tags:4,appid:org.telegram.desktop
windowrule=tags:4,appid:signal

# ── Tag 5 — Media players ────────────────────────────────────────────────────
windowrule=tags:5,appid:mpv
windowrule=tags:5,appid:vlc
windowrule=tags:5,appid:com.spotify.Client

# ── Tag 6 — Documents, writing, PDF viewers ──────────────────────────────────
# LibreOffice — PCRE2 regex matches soffice, libreoffice-writer, -calc, etc.
windowrule=tags:6,appid:libreoffice.*
windowrule=tags:6,appid:org.libreoffice.*
windowrule=tags:6,appid:obsidian
# Zathura — short form for Arch/Void; full form for Flatpak
windowrule=tags:6,appid:zathura
windowrule=tags:6,appid:org.pwmt.zathura
windowrule=tags:6,appid:evince

# ── Tag 7 — GUI system utilities ─────────────────────────────────────────────
windowrule=tags:7,appid:pavucontrol
windowrule=tags:7,appid:nm-connection-editor
windowrule=tags:7,appid:blueman-manager

# ── Tag 8 — Design and creative tools ────────────────────────────────────────
windowrule=tags:8,appid:gimp
windowrule=tags:8,appid:org.inkscape.Inkscape
windowrule=tags:8,appid:krita
windowrule=tags:8,appid:blender

# ── Tag 9 — Gaming and launchers ─────────────────────────────────────────────
windowrule=tags:9,appid:steam
windowrule=tags:9,appid:heroic
# Regex matches "Steam", "Steam Guard", "Steam Web Helper", etc.
windowrule=tags:9,title:.*Steam.*

# ── Force floating windows ───────────────────────────────────────────────────
windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,appid:nm-connection-editor
windowrule=isfloating:1,appid:blueman-manager
windowrule=isfloating:1,appid:lxappearance
windowrule=isfloating:1,appid:qt5ct
windowrule=isfloating:1,appid:qt6ct
windowrule=isfloating:1,appid:kvantummanager
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk

# Dialog detection by title (works across apps that share a parent appid)
windowrule=isfloating:1,title:Open File
windowrule=isfloating:1,title:Save File
windowrule=isfloating:1,title:Save As
windowrule=isfloating:1,title:Print
windowrule=isfloating:1,title:Picture-in-Picture

# ── Floating window preset sizes ─────────────────────────────────────────────
windowrule=isfloating:1,width:900,height:640,appid:pavucontrol
windowrule=isfloating:1,width:780,height:540,appid:nm-connection-editor
windowrule=isfloating:1,width:680,height:500,appid:blueman-manager

# ── Scroller proportion overrides ────────────────────────────────────────────
# Give browsers a wider slot when they land in the scroller (Tags 1 or 9)
windowrule=scroller_proportion:0.85,appid:firefox
windowrule=scroller_proportion:0.85,appid:brave-browser

# ── Silent open (no focus steal on launch) ────────────────────────────────────
windowrule=isopensilent:1,appid:com.obsproject.Studio
windowrule=isopensilent:1,appid:discord

# ── Global keybinding — app-level shortcut that works from any tag ────────────
# The globalkeybinding windowrule wires a compositor-level hotkey into a
# specific window. Only works for Wayland-native apps.
windowrule=globalkeybinding:ctrl+alt-o,appid:com.obsproject.Studio

# ── Gaming — per-window tearing ───────────────────────────────────────────────
# Uncomment and set allow_tearing=1 globally if you want tearing for games.
# windowrule=force_tearing:1,appid:steam
# windowrule=force_tearing:1,appid:gamescope

# ── Named scratchpad size rules ───────────────────────────────────────────────
# The appid must exactly match what the spawned command registers with the WM.
# Dimensions set here; the matching bind= line (below) provides the command.
windowrule=isnamedscratchpad:1,width:1300,height:820,appid:foot-yazi
windowrule=isnamedscratchpad:1,width:500,height:650,appid:gnome-calculator
windowrule=isnamedscratchpad:1,width:1100,height:700,appid:com.spotify.Client


# ───────────────────────────────────────────────────────────────────────────────
# KEY BINDINGS
#
# Format:  bind=<MODIFIER>,<KEY>,<COMMAND>,<PARAMS>
# Modifiers (ALL-CAPS): SUPER  CTRL  ALT  SHIFT  NONE
# Combine with +:       SUPER+SHIFT  SUPER+CTRL  SUPER+CTRL+SHIFT
#
# Bind flags (append directly to "bind", e.g. "bindl"):
#   l = also active when the screen is locked
#   r = trigger on key release instead of press
#   s = match by keysym instead of keycode
#   p = pass the key event through to the client
#
# spawn        direct exec; supports space-separated args; NO shell syntax
# spawn_shell  runs in /bin/sh; supports pipes, $(), &&, redirects
#
# ─── KEYMODE STRUCTURE ───────────────────────────────────────────────────────
#   keymode=common   active in ALL modes (hardware keys, quit, reload)
#   keymode=default  normal desktop operation
#   keymode=resize   window resize mode (SUPER+r to enter, Escape to leave)
#
# ─── COMPLETE KEY-COLLISION AUDIT ────────────────────────────────────────────
#   SUPER+h/j/k/l            focusdir (left/down/up/right)
#   SUPER+SHIFT+h/j/k/l      exchange_client (swap left/down/up/right)
#   SUPER+ALT+h/j/k/l        setmfact / incnmaster
#   ALT+h/j/k/l              scroller_stack
#   SUPER+CTRL+Arrow          smartmovewin (floating move — arrows only, no hjkl)
#   SUPER+CTRL+SHIFT+Arrow    smartresizewin (floating resize — arrows only)
#   SUPER+CTRL+l              spawn swaylock  (Lock — no hjkl conflict)
#   SUPER+CTRL+t              spawn alacritty
#   SUPER+CTRL+p              toggle_trackpad_enable
#   SUPER+CTRL+Return         spawn foot
#   SUPER+comma               focusmon,left   (one use only — no toggle_render_border)
#   SUPER+p                   toggle_render_border  (moved from SUPER+comma in v1)
#   SUPER+w                   spawn waypaper
#   keymode=common            hardware + quit/reload — NOT repeated in default
# ───────────────────────────────────────────────────────────────────────────────


# ┌──────────────────────────────────────────────────────────────────────────┐
# │  KEYMODE: COMMON — active in EVERY mode, including resize mode           │
# └──────────────────────────────────────────────────────────────────────────┘
keymode=common

bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,q,quit

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-


# ┌──────────────────────────────────────────────────────────────────────────┐
# │  KEYMODE: DEFAULT — normal desktop operation                             │
# └──────────────────────────────────────────────────────────────────────────┘
keymode=default

# ── Application launchers ──────────────────────────────────────────────────────
bind=SUPER,Return,spawn,kitty
bind=SUPER+CTRL,Return,spawn,foot
bind=SUPER+CTRL,t,spawn,alacritty
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,b,spawn,firefox
bind=SUPER,e,spawn,thunar
bind=SUPER,w,spawn,waypaper

# Screenshot: area-select region → satty annotation tool
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" -t ppm - | satty -f -
# Full-screen screenshot saved to ~/Pictures/Screenshots/
bind=SUPER,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/shot_$(date +%Y%m%d_%H%M%S).png

# Clipboard history picker (requires cliphist + rofi + wl-clipboard)
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy

# swaync notification sidebar toggle
bind=SUPER+SHIFT,n,spawn,swaync-client -t

# Lock screen — SUPER+CTRL+l (L for Lock; no conflict with SUPER+l = focus-right)
bind=SUPER+CTRL,l,spawn,swaylock -f -c 000000

# ── Window management ──────────────────────────────────────────────────────────
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,Space,togglefloating
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverlay
bind=SUPER,m,togglemaximizescreen
bind=SUPER,p,toggle_render_border
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized

# ── Focus navigation (hjkl + arrow keys) ──────────────────────────────────────
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Stack cycling
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

# Overview / expose all windows
bind=ALT,Tab,toggleoverview

# Jump back to the previously focused window
bind=ALT,grave,focuslast

# ── Window swapping (hjkl + arrow keys) ───────────────────────────────────────
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Swap focused window into master position (DWM "zoom")
bind=SUPER,z,zoom

# ── Scroller controls (Tags 1 and 9) ──────────────────────────────────────────
bind=ALT,h,scroller_stack,left
bind=ALT,l,scroller_stack,right
bind=ALT,k,scroller_stack,up
bind=ALT,j,scroller_stack,down
bind=ALT,e,set_proportion,0.80
bind=ALT,x,switch_proportion_preset

# ── Master-stack adjustments ───────────────────────────────────────────────────
bind=SUPER+ALT,l,setmfact,+10
bind=SUPER+ALT,h,setmfact,-10
bind=SUPER+ALT,k,incnmaster,+1
bind=SUPER+ALT,j,incnmaster,-1

# ── Layout cycling ─────────────────────────────────────────────────────────────
bind=SUPER,t,switch_layout

# ── Gaps ───────────────────────────────────────────────────────────────────────
bind=SUPER+ALT,g,togglegaps
bind=SUPER+ALT,equal,incgaps,+4
bind=SUPER+ALT,minus,incgaps,-4

# ── Floating window move (Arrow keys only — avoids all hjkl and CTRL+l conflicts) ──
bind=SUPER+CTRL,Left,smartmovewin,left
bind=SUPER+CTRL,Right,smartmovewin,right
bind=SUPER+CTRL,Up,smartmovewin,up
bind=SUPER+CTRL,Down,smartmovewin,down

# Centre a floating window on screen
bind=SUPER,c,centerwin

# ── Floating window resize (SUPER+CTRL+SHIFT + Arrow) ─────────────────────────
bind=SUPER+CTRL+SHIFT,Left,smartresizewin,left
bind=SUPER+CTRL+SHIFT,Right,smartresizewin,right
bind=SUPER+CTRL+SHIFT,Up,smartresizewin,up
bind=SUPER+CTRL+SHIFT,Down,smartresizewin,down

# ── Enter resize mode ──────────────────────────────────────────────────────────
bind=SUPER,r,setkeymode,resize

# ── Tag navigation (view / move window) ───────────────────────────────────────
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER+ALT,1,tagsilent,1
bind=SUPER+ALT,2,tagsilent,2
bind=SUPER+ALT,3,tagsilent,3
bind=SUPER+ALT,4,tagsilent,4
bind=SUPER+ALT,5,tagsilent,5
bind=SUPER+ALT,6,tagsilent,6
bind=SUPER+ALT,7,tagsilent,7
bind=SUPER+ALT,8,tagsilent,8
bind=SUPER+ALT,9,tagsilent,9

bind=SUPER,bracketleft,viewtoleft_have_client
bind=SUPER,bracketright,viewtoright_have_client
bind=SUPER+SHIFT,bracketleft,tagtoleft
bind=SUPER+SHIFT,bracketright,tagtoright

# ── Multi-monitor navigation ────────────────────────────────────────────────────
bind=SUPER,period,focusmon,right
bind=SUPER,comma,focusmon,left
bind=SUPER+SHIFT,period,tagmon,right
bind=SUPER+SHIFT,comma,tagmon,left

# ── Scratchpads ─────────────────────────────────────────────────────────────────
bind=ALT,z,toggle_scratchpad
bind=SUPER+SHIFT,z,minimized

# Named scratchpads — syntax: toggle_named_scratchpad,<appid>,<title>,<command>
# The window dimensions are set in the matching windowrule=isnamedscratchpad lines above.
bind=SUPER,F1,toggle_named_scratchpad,foot-yazi,none,foot --app-id foot-yazi -e yazi
bind=SUPER,F2,toggle_named_scratchpad,gnome-calculator,none,gnome-calculator
bind=SUPER,F3,toggle_named_scratchpad,com.spotify.Client,none,spotify

# ── Miscellaneous ───────────────────────────────────────────────────────────────
bind=SUPER+CTRL,p,toggle_trackpad_enable


# ┌──────────────────────────────────────────────────────────────────────────┐
# │  KEYMODE: RESIZE — enter: SUPER+r  |  exit: Escape or SUPER+r           │
# └──────────────────────────────────────────────────────────────────────────┘
keymode=resize

bind=NONE,h,smartresizewin,left
bind=NONE,l,smartresizewin,right
bind=NONE,k,smartresizewin,up
bind=NONE,j,smartresizewin,down
bind=NONE,Left,smartresizewin,left
bind=NONE,Right,smartresizewin,right
bind=NONE,Up,smartresizewin,up
bind=NONE,Down,smartresizewin,down
bind=NONE,equal,incgaps,+4
bind=NONE,minus,incgaps,-4
bind=NONE,Escape,setkeymode,default
bind=SUPER,r,setkeymode,default

# Return to default mode for all subsequent bind= directives
keymode=default


# ───────────────────────────────────────────────────────────────────────────────
# MOUSE BINDINGS
# Format: mousebind=<MODIFIER>,<BUTTON>,<COMMAND>,<PARAMS>
# NOTE: NONE modifier is valid ONLY for btn_middle, not for left/right buttons.
# ───────────────────────────────────────────────────────────────────────────────

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=NONE,btn_middle,togglemaximizescreen,0


# ───────────────────────────────────────────────────────────────────────────────
# AXIS (SCROLL WHEEL) BINDINGS
# Format: axisbind=<MODIFIER>,<DIRECTION>,<COMMAND>,<PARAMS>
# DIRECTION: UP | DOWN | LEFT | RIGHT
# ───────────────────────────────────────────────────────────────────────────────

axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+ALT,UP,setmfact,+5
axisbind=SUPER+ALT,DOWN,setmfact,-5


# ───────────────────────────────────────────────────────────────────────────────
# GESTURE BINDINGS  (touchpad multi-finger swipes)
# Format: gesturebind=<MODIFIER>,<DIRECTION>,<FINGERS>,<COMMAND>,<PARAMS>
# ───────────────────────────────────────────────────────────────────────────────

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggle_scratchpad


# ───────────────────────────────────────────────────────────────────────────────
# SWITCH BINDINGS  (laptop lid open / close)
# Prerequisite — add to /etc/systemd/logind.conf and reboot:
#   HandleLidSwitch=ignore
#   HandleLidSwitchExternalPower=ignore
#   HandleLidSwitchDocked=ignore
# ───────────────────────────────────────────────────────────────────────────────

switchbind=fold,spawn,swaylock -f -c 000000
switchbind=unfold,spawn,wlr-dpms on


# ═══════════════════════════════════════════════════════════════════════════════
#  KEYBIND CHEAT SHEET
# ═══════════════════════════════════════════════════════════════════════════════
#
#  SESSION  (keymode=common — work in ALL modes)
#    SUPER+SHIFT+r          Reload config
#    SUPER+SHIFT+q          Quit mango
#    SUPER+CTRL+l           Lock screen (swaylock)
#
#  APPLICATIONS
#    SUPER+Return           kitty
#    SUPER+CTRL+Return      foot
#    SUPER+CTRL+t           alacritty
#    SUPER+d                Rofi app launcher
#    SUPER+b                Firefox
#    SUPER+e                Thunar file manager
#    SUPER+w                Waypaper (wallpaper manager)
#    SUPER+SHIFT+s          Screenshot area → satty
#    SUPER+Print            Screenshot full screen
#    SUPER+v                Clipboard history (cliphist + rofi)
#    SUPER+SHIFT+n          swaync notification sidebar
#
#  WINDOW MANAGEMENT
#    SUPER+q                Kill focused window
#    SUPER+f                Toggle fullscreen
#    SUPER+SHIFT+f          Toggle fake-fullscreen
#    SUPER+Space            Toggle floating
#    SUPER+g                Toggle global / sticky
#    SUPER+o                Toggle overlay (always-on-top)
#    SUPER+m                Toggle maximise-screen
#    SUPER+p                Toggle window border rendering
#    SUPER+i                Minimise to scratchpad pool
#    SUPER+SHIFT+i          Restore last minimised window
#    SUPER+z                Swap with master (DWM zoom)
#    SUPER+c                Centre floating window
#
#  FOCUS  (vim keys or arrow keys)
#    SUPER+h/j/k/l          Focus left/down/up/right
#    SUPER+Arrow            Focus in direction
#    SUPER+Tab              Next in stack
#    SUPER+SHIFT+Tab        Prev in stack
#    ALT+Tab                Toggle overview / expose
#    ALT+`                  Focus last window
#
#  SWAP
#    SUPER+SHIFT+h/j/k/l    Swap window left/down/up/right
#    SUPER+SHIFT+Arrow       Swap window in direction
#
#  FLOAT MOVE & RESIZE
#    SUPER+CTRL+Arrow              Move floating window
#    SUPER+CTRL+SHIFT+Arrow        Resize floating window
#    SUPER+r → h/j/k/l or Arrow   Resize mode (Escape or SUPER+r to exit)
#
#  LAYOUT
#    SUPER+t                Cycle layouts (circle_layout list)
#    ALT+h/j/k/l            Scroller: nudge stack in direction
#    ALT+e                  Scroller: set proportion 0.80
#    ALT+x                  Scroller: cycle proportion presets
#    SUPER+ALT+h/l          Master factor decrease/increase
#    SUPER+ALT+j/k          Remove/add master window
#    SUPER+ALT+g            Toggle gaps on/off
#    SUPER+ALT+= / −        Increase/decrease gap size
#
#  TAGS
#    SUPER+1–9              View tag 1–9
#    SUPER+0                View all tags (all-tags state)
#    SUPER+SHIFT+1–9        Move window to tag
#    SUPER+ALT+1–9          Move window silently (no refocus)
#    SUPER+[  / SUPER+]     Prev/next tag (skips empty)
#    SUPER+SHIFT+[ / ]      Move window to prev/next tag
#
#  MONITORS
#    SUPER+.  / SUPER+,     Focus right / left monitor
#    SUPER+SHIFT+. / ,      Move window to right / left monitor
#
#  SCRATCHPADS
#    ALT+z                  Toggle scratchpad pool
#    SUPER+SHIFT+z          Minimise window into scratchpad pool
#    SUPER+F1               Named scratchpad: Yazi file manager (foot)
#    SUPER+F2               Named scratchpad: GNOME Calculator
#    SUPER+F3               Named scratchpad: Spotify
#
#  SCROLL WHEEL
#    SUPER+Scroll Up/Down   Navigate tags
#    SUPER+ALT+Scroll       Adjust master area factor
#
#  TOUCHPAD GESTURES
#    3-finger swipe         Focus in direction
#    4-finger L / R         Navigate tags
#    4-finger Up            Toggle overview
#    4-finger Down          Toggle scratchpad pool
#
#  MISC
#    SUPER+CTRL+p           Toggle trackpad enable/disable
#
#  IPC (run in terminal)
#    mmsg -g                Dump compositor state as JSON
#    mmsg -e                Print active window appid and title
#    mmsg -b                Print current keymode
#    mmsg -d reload_config  Reload config via IPC
#    mmsg -d quit           Quit mango via IPC
# ═══════════════════════════════════════════════════════════════════════════════
