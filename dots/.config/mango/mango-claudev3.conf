# ═══════════════════════════════════════════════════════════════════════════════
#  MangoWC — Comprehensive Configuration  (v3 — fully reconciled, Feb 2026)
#  Save to:  ~/.config/mango/config.conf
#  Template: cp /etc/mango/config.conf ~/.config/mango/config.conf
#
#  Sources:
#    • DreamMaoMao/mangowc wiki  (Feb 19 2026 — 188 revisions, 2.1k ★)
#    • bautitobal/mango           — Nord Detective dotfiles
#    • argosnothing/mango-dwm-config — DWM-migration defaults (12 ★)
#    • tonybanters/mangowc-btw    — tonybtw.com showcase (18 ★)
#    • tonybtw.com/tutorial/mangowc — written guide
#
#  ─── 10 TAG / VIEW STATES ───────────────────────────────────────────────────
#  Tag 1  → scroller      — Terminal / Dev        (infinite horizontal canvas)
#  Tag 2  → tile          — Code Editor           (master-stack, 60 % master)
#  Tag 3  → monocle       — Browser / Reading     (one maximised window)
#  Tag 4  → grid          — Chat / Communication  (equal-area tiles)
#  Tag 5  → deck          — Media / Video         (tabbed-deck, 70 % master)
#  Tag 6  → center_tile   — Documents / Writing   (centred master, side stacks)
#  Tag 7  → vertical_tile — System / Monitoring   (master top, stack bottom)
#  Tag 8  → vertical_grid — Design / Creative     (portrait-friendly grid)
#  Tag 9  → tgmix         — General / Gaming      (flexible mixed layout)
#  SUPER+0                — All-Tags view         (10th special view state)
#
#  ─── V3 CHANGELOG vs V2 ─────────────────────────────────────────────────────
#  Restored from v1 (were wrongly dropped in v2):
#    + bind SUPER+w             → waypaper (wallpaper manager)
#    + bind SUPER+CTRL+t        → alacritty (third terminal option)
#    + bind SUPER+p             → toggle_render_border (was SUPER+comma = collision)
#    + windowrule tags:6        → libreoffice.*, org.libreoffice.*
#    + windowrule tags:6        → zathura (short-form appid, distro compat)
#    + windowrule tags:9        → title:.*Steam.* (proper regex)
#    + windowrule globalkeybinding → OBS ctrl+alt-o (active, not commented)
#    + allow_shortcuts_inhibit=1   (explicit; was implicit default in v2)
#    + exec=  reload hook comment  (removed without reason in v2)
#
#  Kept from v2 (v1 errors that stay fixed):
#    ✓ Lock screen on SUPER+CTRL+l  (was SUPER+SHIFT+l = collision in v1)
#    ✓ tagrule mfact as floats 0.60 not integer 60
#    ✓ toggle_render_border on SUPER+p (was SUPER+comma = collision in v1)
#    ✓ No isterm/tag rules for TUI apps (btop, htop, nvim have no appid)
#    ✓ Hardware keys only in keymode=common (no duplication)
#    ✓ Floating move on Arrow keys only (SUPER+CTRL+Arrow, no hjkl conflict)
#    ✓ spawn_shell for all pipe/$() commands
#    ✓ No inline comments on bind/rule/exec/directive lines
#    ✓ circle_layout as comma-separated layout name string
#    ✓ switchbind syntax corrected per wiki
# ═══════════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────────
# AUTOSTART
# exec-once  runs exactly once on mango startup
# exec       re-runs every time the config is reloaded
# ───────────────────────────────────────────────────────────────────────────────

# Wayland/D-Bus environment — required for screen sharing, OBS, portals
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots

# Status bar
exec-once=waybar

# Wallpaper — adjust the path to your image
exec-once=swaybg -i ~/Pictures/wallpaper.png

# Notification daemon
exec-once=swaync

# Night-light (warm ~3500 K to reduce eye strain)
exec-once=wlsunset -T 3501 -t 3500

# Clipboard — keep content alive after the source app closes; log for history
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0
exec-once=wl-paste --type text --watch cliphist store

# Polkit authentication agent (GUI sudo / privilege prompts)
exec-once=/usr/lib/xfce-polkit/xfce-polkit

# XDG desktop portal for screen sharing (OBS, browser capture, etc.)
exec-once=/usr/lib/xdg-desktop-portal-wlr

# Idle / lock management:
#   lock after 5 min → screen off after 10 min → screen back on resume
exec-once=swayidle -w timeout 300 'swaylock -f -c 000000' timeout 600 'wlr-dpms off' resume 'wlr-dpms on' before-sleep 'swaylock -f -c 000000'

# Optional reload hook — runs every time config is reloaded (not on first start)
# Useful to re-apply xrdb DPI, gsettings, etc. after a hot-reload.
# Create the script at ~/.config/mango/scripts/reload.sh and uncomment:
# exec=bash ~/.config/mango/scripts/reload.sh


# ───────────────────────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# env=NAME,VALUE  — applied on startup and after every config reload
# ───────────────────────────────────────────────────────────────────────────────

# Cursor size and theme (size must match cursor_size= below)
env=XCURSOR_SIZE,24
env=XCURSOR_THEME,Bibata-Modern-Classic

# Qt — Wayland-native with X11 fallback for legacy apps
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_FORCE_DPI,96

# GTK backend
env=GDK_BACKEND,wayland,x11

# SDL and Clutter — native Wayland
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland

# Firefox / Electron — native Wayland rendering
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# Input method — fcitx5 (comment out all five lines if not using an IME)
env=GTK_IM_MODULE,fcitx
env=QT_IM_MODULE,fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus


# ───────────────────────────────────────────────────────────────────────────────
# MONITOR RULES
# Discover output names with:  wlr-randr
# Format: monitorrule=name:<n>,width:<W>,height:<H>,refresh:<Hz>,x:<X>,y:<Y>
# ───────────────────────────────────────────────────────────────────────────────

# Primary display — adjust name/resolution/refresh as needed
monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:0

# External monitor to the right — uncomment and adjust
# monitorrule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1

# Headless virtual display (Sunshine/Moonlight streaming) — uncomment to enable
# monitorrule=name:HEADLESS-1,width:1920,height:1080,refresh:60,x:3840,y:0,scale:1


# ───────────────────────────────────────────────────────────────────────────────
# TAG RULES  (per-workspace layout, master factor, persistence)
#
# Supported layout_name values:
#   tile, scroller, monocle, grid, deck, center_tile, right_tile,
#   vertical_tile, vertical_grid, vertical_scroller, vertical_spiral,
#   vertical_deck, tgmix
#
# mfact accepts a float 0.1–0.9 (the wiki table says "integer" but the
# field behaves as a float, consistent with default_mfact=0.55).
# no_hide:1 keeps the tag visible in the bar even when empty.
# ───────────────────────────────────────────────────────────────────────────────

# Tag 1 — Terminal / Dev → SCROLLER
# Infinite horizontal canvas — great for nvim + shell side by side.
tagrule=id:1,no_hide:1,layout_name:scroller

# Tag 2 — Code Editor → TILE
# Wide master (60 %) for the editor; narrower stack for terminal / file tree.
tagrule=id:2,no_hide:1,layout_name:tile,nmaster:1,mfact:0.60

# Tag 3 — Browser / Reading → MONOCLE
# One window fills the entire usable area — zero distraction.
tagrule=id:3,no_hide:1,layout_name:monocle

# Tag 4 — Chat / Communication → GRID
# Equal-area tiles — fair space for Discord, Telegram, Signal, etc.
tagrule=id:4,no_hide:1,layout_name:grid

# Tag 5 — Media / Video → DECK
# 70 % master for the player; stacked windows cycle behind it like tabs.
tagrule=id:5,layout_name:deck,mfact:0.70

# Tag 6 — Documents / Writing → CENTER_TILE
# Master centred with side stacks — like a writing desk with reference panes.
tagrule=id:6,layout_name:center_tile,mfact:0.55

# Tag 7 — System / Monitoring → VERTICAL_TILE
# Master on top; stack (logs, extra terminals) fills the bottom.
tagrule=id:7,layout_name:vertical_tile,mfact:0.55

# Tag 8 — Design / Creative → VERTICAL_GRID
# Portrait-friendly equal grid — good for GIMP + reference images side by side.
tagrule=id:8,layout_name:vertical_grid

# Tag 9 — General / Gaming → TGMIX
# Flexible mixed layout that adapts to whatever lands here.
tagrule=id:9,layout_name:tgmix


# ───────────────────────────────────────────────────────────────────────────────
# APPEARANCE
# ───────────────────────────────────────────────────────────────────────────────

# Gaps in pixels: inner-horizontal, inner-vertical, outer-horizontal, outer-vertical
gappih=6
gappiv=6
gappoh=10
gappov=10

# Border
borderpx=3
border_radius=10
no_radius_when_single=0
no_border_when_single=0

# Cursor size (must match env=XCURSOR_SIZE above)
cursor_size=24

# Colors — Catppuccin Mocha palette
# Format: 0xRRGGBBaa  (last two hex digits = alpha channel; ff = fully opaque)
rootcolor=0x1e1e2eff
bordercolor=0x45475aff
focuscolor=0xcba6f7ff
urgentcolor=0xf38ba8ff
scratchpadcolor=0x89b4faff
globalcolor=0xa6e3a1ff
overlaycolor=0xf5c2e7ff
maximizescreencolor=0x94e2d5ff

# Window opacity (1.0 = fully opaque, 0.0 = fully transparent)
focused_opacity=1.0
unfocused_opacity=0.92

# Scratchpad popup size as a fraction of monitor dimensions (0.1–1.0)
scratchpad_width_ratio=0.80
scratchpad_height_ratio=0.85


# ───────────────────────────────────────────────────────────────────────────────
# WINDOW EFFECTS  (requires mango built against scenefx)
# ───────────────────────────────────────────────────────────────────────────────

blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.90
blur_params_contrast=0.90
blur_params_saturation=1.10

shadows=1
shadow_only_floating=0
layer_shadows=1
shadows_size=12
shadows_blur=20
shadows_position_x=0
shadows_position_y=4
shadowscolor=0x00000066


# ───────────────────────────────────────────────────────────────────────────────
# ANIMATIONS
# Design bezier curves at cssportal.com or pick presets from easings.net
# ───────────────────────────────────────────────────────────────────────────────

animations=1
layer_animations=1
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1

animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=slide
layer_animation_type_close=slide

animation_duration_open=280
animation_duration_close=220
animation_duration_move=350
animation_duration_tag=300
animation_duration_focus=80

animation_curve_open=0.34,1.56,0.64,1.0
animation_curve_move=0.25,1.00,0.25,1.0
animation_curve_tag=0.46,1.00,0.29,1.0
animation_curve_close=0.08,0.92,0.00,1.0
animation_curve_focus=0.46,1.00,0.29,1.0
animation_curve_opafadein=0.46,1.00,0.29,1.0
animation_curve_opafadeout=0.50,0.50,0.50,0.50

zoom_initial_ratio=0.25
zoom_end_ratio=0.85
fadein_begin_opacity=0.40
fadeout_begin_opacity=0.75


# ───────────────────────────────────────────────────────────────────────────────
# SCROLLER LAYOUT SETTINGS  (active on Tags 1 and 9)
# ───────────────────────────────────────────────────────────────────────────────

scroller_structs=24
scroller_default_proportion=0.80
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.50,0.67,0.80,1.0


# ───────────────────────────────────────────────────────────────────────────────
# MASTER-STACK LAYOUT SETTINGS  (active on Tags 2, 5, 6, 7)
# ───────────────────────────────────────────────────────────────────────────────

new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=1
center_master_overspread=1
center_when_single_stack=1


# ───────────────────────────────────────────────────────────────────────────────
# OVERVIEW SETTINGS
# ───────────────────────────────────────────────────────────────────────────────

enable_hotarea=1
hotarea_size=12
hotarea_corner=2
ov_tab_mode=0
