# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

# ============================================================
# yazi.toml — General Configuration
# Version: 26.x  |  Updated: 2026-02
# ============================================================

# ── Manager ──────────────────────────────────────────────────
[mgr]
ratio          = [1, 4, 3]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
show_hidden    = false
show_symlink   = true
linemode       = "size"
scrolloff      = 5
title_format   = "Yazi: {cwd}"

# ── Preview ──────────────────────────────────────────────────
[preview]
wrap          = "no"
tab_size      = 2
max_width     = 900
max_height    = 1800
image_filter  = "lanczos3"   # nearest|bilinear|lanczos3 — best quality, slowest
image_quality = 80           # 50–90
cache_dir     = ""           # empty = system cache; set abs path for persistence

# ── Tasks ────────────────────────────────────────────────────
[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
suppress_preload = false

# ── Input ────────────────────────────────────────────────────
[input]
cursor_blink = true

# ── Confirm Dialogs ──────────────────────────────────────────
[confirm]
trash_title     = "Move {n} selected file(s) to trash?"
delete_title    = "Permanently delete {n} selected file(s)?"
overwrite_title = "Overwrite file?"

# ── Pick / Open-with Dialog ──────────────────────────────────
[pick]
open_title = "Open with:"

# ── Openers ──────────────────────────────────────────────────
# block = true  → Yazi hides to alt screen while app runs (TUI apps)
# orphan = true → Process keeps running after Yazi exits (GUI apps)
# $1 = first file path; $@ = all file paths (passed as shell positional args)

[opener]

edit = [
    { run = 'nvim "$@"', desc = "Neovim", block = true, for = "unix" },
]

view_pdf = [
    { run = 'zathura "$1"',  desc = "Zathura",           orphan = true, for = "linux" },
    { run = 'xdg-open "$1"', desc = "Default PDF viewer",               for = "linux" },
]

view_image = [
    { run = 'nsxiv -a "$@"', desc = "nsxiv",             orphan = true, for = "linux" },
    { run = 'xdg-open "$1"', desc = "Default viewer",                   for = "linux" },
]

view_video = [
    { run = 'mpv "$@"',      desc = "mpv",               orphan = true, for = "linux" },
    { run = 'xdg-open "$1"', desc = "Default player",                   for = "linux" },
]

view_audio = [
    { run = 'mpv --no-video "$@"', desc = "mpv (audio)", orphan = true, for = "linux" },
    { run = 'xdg-open "$1"',       desc = "Default player",             for = "linux" },
]

view_office = [
    { run = 'libreoffice "$@"', desc = "LibreOffice",    orphan = true, for = "linux" },
    { run = 'xdg-open "$1"',    desc = "Default viewer",               for = "linux" },
]

open = [
    { run = 'xdg-open "$1"', desc = "Open with system default", for = "linux" },
]

# ── Open Rules ───────────────────────────────────────────────
[open]
prepend_rules = [

    # Web / HTML
    { name = "*.{html,htm,xhtml}", use = ["open", "edit"] },

    # PDFs
    { mime = "application/pdf",    use = ["view_pdf"] },

    # Images
    { mime = "image/*",            use = ["view_image"] },

    # Video
    { mime = "video/*",            use = ["view_video"] },

    # Audio
    { mime = "audio/*",            use = ["view_audio"] },

    # Office documents (mime-type rules)
    { mime = "application/vnd.openxmlformats-officedocument.*", use = ["view_office"] },
    { mime = "application/vnd.ms-*",                            use = ["view_office"] },
    { mime = "application/vnd.oasis.opendocument.*",            use = ["view_office"] },
    { mime = "application/msword",                              use = ["view_office"] },
    # Office documents (extension rules for when MIME is wrong)
    { name = "*.{doc,docx,odt,xls,xlsx,ods,ppt,pptx,odp}",     use = ["view_office"] },

    # Code / Config → Neovim
    { name = "*.{py,pyw,ipynb}",                                    use = ["edit"] },
    { name = "*.{js,mjs,cjs,ts,tsx,jsx,vue,svelte}",               use = ["edit"] },
    { name = "*.{rs,go,c,cc,cpp,h,hpp,cs,java,kt,swift}",          use = ["edit"] },
    { name = "*.{rb,php,lua,ex,exs,erl,hs,elm,ml,clj}",            use = ["edit"] },
    { name = "*.{sh,bash,zsh,fish,nu,ps1,bat}",                    use = ["edit"] },
    { name = "*.{css,scss,sass,less}",                             use = ["edit"] },
    { name = "*.{json,jsonc,toml,yaml,yml,xml,ini,cfg,conf}",      use = ["edit"] },
    { name = "*.{md,mdx,rst,org,txt,log,csv,tsv}",                 use = ["edit"] },
    { name = "*.{tf,hcl,nix,dockerfile,dockerignore}",             use = ["edit"] },
    { name = ".{env,gitignore,gitconfig,gitattributes,editorconfig}", use = ["edit"] },
    { mime = "text/*",                                              use = ["edit"] },
    { mime = "application/json",                                    use = ["edit"] },
    { mime = "application/xml",                                     use = ["edit"] },
    { mime = "application/javascript",                              use = ["edit"] },
    { mime = "application/x-sh",                                   use = ["edit"] },

    # Archives — use system default ("open" = xdg-open); archive plugin used via keymap
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["open"] },
]

# ── Git Plugin Fetchers ───────────────────────────────────────
# Required: tells Yazi which fetcher plugin to use for all files/dirs.
# Without these lines, git.yazi shows no status even if setup() is called.
[[plugin.prepend_fetchers]]
id   = "git"
name = "*"
run  = "git"

[[plugin.prepend_fetchers]]
id   = "git"
name = "*/"
run  = "git"

# ── Log ──────────────────────────────────────────────────────
[log]
enabled = false
