# "$schema" = "https://yazi-rs.github.io/schemas/theme.json"

# ============================================================
# theme.toml — Color Theme / Flavor Configuration
# Version: 26.x  |  Updated: 2026-02
#
# Noctalia flavor is loaded from:
#   ~/.config/yazi/flavors/noctalia.yazi/flavor.toml
#
# Installed via:  ya pack -a noctalia (or symlinked from noctalia.dev)
#
# This file only defines *overrides* on top of noctalia.
# The [flavor] block at the bottom activates the flavor;
# everything above overrides specific tokens if desired.
#
# To apply noctalia with zero overrides: keep only [flavor].
# ============================================================

# ── Tab Separators ───────────────────────────────────────────
# Powerline  (same glyphs used in your tmux theme)
[tabs]
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# ── Status Bar Separators ────────────────────────────────────
[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# ── Border Symbol ────────────────────────────────────────────
border_symbol = "│"

# ── Which-key ────────────────────────────────────────────────
[which]
separator = "  "

# ── Activate Flavor ──────────────────────────────────────────
# Both dark and light modes point to noctalia so it is always used.
[flavor]
dark  = "noctalia"
light = "noctalia"
