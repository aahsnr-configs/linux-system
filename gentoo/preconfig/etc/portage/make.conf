###/etc/portage/make.conf
COMMON_FLAGS="-O3 -march=native -pipe -flto=auto -fno-semantic-interposition -fno-plt"
#COMMON_FLAGS="-O3 -pipe -march=native -flto -fno-semantic-interposition -fopenmp  -fopenmp-simd"
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"
#LDFLAGS="${LDFLAGS} -Wl,-O2 -Wl,--as-needed"
LDFLAGS="${LDFLAGS} -Wl,-O3 -Wl,--as-needed -Wl,-flto=auto"
#RUSTFLAGS="-C opt-level=3 -C target-cpu=native -Clinker-plugin-lto""
MAKEOPTS="-j22"
NOCOMMON_OVERRIDE_LIBTOOL="yes"
#EMERGE_DEFAULT_OPTS="--keep-going=y"
EMERGE_DEFAULT_OPTS="--jobs=10 --keep-going=y --ask"
ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
VIDEO_CARDS="nvidia intel"
# USE="-elogind systemd -gnome -kde -ccache -tpm zstd truetype harfbuzz pipewire profile \
#     clamav -motif gtk gtk4 pulseaudio qt5 qt6 sound-server app-i18n seccomp appindicator \
#     -smartcard wayland pam clang policykit opengl keyring sqlite apparmor libnotify \
#     cups -quicktime nvidia udev alsa jit audit udisks nvenc tiff cryptsetup appindicator \
#     pie gui X upower dbus jpeg lto pgo firmware python ffmpeg fips ipv6 vulkan orc \
#     -accessibility bluetooth -handbook fontconfig udisks gstreamer sixel verify-sig"
USE="systemd -accessibility -cups -elogind -fips -gnome -handbook \
     -kde -motif -pulseaudio -quicktime -smartcard -tpm -verify-sig
     apparmor appindicator bluetooth firmware gstreamer gtk gtk4 \
     gui keyring libnotify lto pgo jit nvenc nvidia pipewire \
     qt5 qt6 udisks upower vdpau vulkan wayland zstd X"
# NOTE: Let portage handle the defaults based on profile
# RUBY_TARGETS="ruby33 ruby34"
# PYTHON_TARGETS="python3_14 python3_13"
# PYTHON_SINGLE_TARGET="python3_13"
# LLVM_SLOT=19
L10N="en"
LINGUAS="en"
ABI_X86="64"
# NOTE: This stage was built with the bindist Use flag enabled
# PORTDIR="/var/db/repos/gentoo"
# DISTDIR="/var/cache/distfiles"
# PKGDIR="/var/cache/binpkgs"

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C
GRUB_PLATFORMS="efi-64"
